<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "SF Pro Display",
                "Pretendard",
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    #ffffff 0%,
                    #eeeeee 45%,
                    #d8d8d8 100%
                );

            color: #111;
            overflow: hidden;
        }

        /* 유리 카드 */
        .glass {
            width: min(92vw, 520px);
            padding: 42px;

            text-align: center;

            background: rgba(255, 255, 255, 0.48);
            border: 1px solid rgba(255, 255, 255, 0.75);

            border-radius: 34px;

            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.14),
                inset 0 1px 1px rgba(255, 255, 255, 0.9);

            animation: appear 0.6s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            margin: 0 0 32px;

            font-size: 28px;
            font-weight: 700;
            letter-spacing: -1.2px;
        }

        /* 시간 */
        #time {
            margin-bottom: 30px;

            font-size: clamp(64px, 15vw, 96px);
            font-weight: 700;

            letter-spacing: -5px;
            font-variant-numeric: tabular-nums;

            text-shadow:
                0 3px 15px rgba(0, 0, 0, 0.08);
        }

        /* 입력 영역 */
        .inputs {
            display: flex;
            justify-content: center;
            gap: 10px;

            margin-bottom: 22px;
        }

        input {
            width: 120px;
            height: 52px;

            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 17px;

            background: rgba(255, 255, 255, 0.55);

            outline: none;

            text-align: center;
            font-size: 16px;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        input:hover {
            transform: scale(1.03);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.9);

            box-shadow:
                0 0 0 3px rgba(0, 0, 0, 0.06);

            transform: scale(1.04);
        }

        /* 버튼 */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            min-width: 95px;
            height: 50px;

            border: 0;
            border-radius: 16px;

            background: #111;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.16);

            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                background 0.18s ease;
        }

        /* 마우스를 올리면 커짐 */
        button:hover {
            transform: scale(1.08);

            background: #000;

            box-shadow:
                0 14px 30px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: scale(0.95);
        }

        /* 시간 종료 */
        .finished {
            animation: pulse 0.7s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.06);
            }
        }

        /* 휴대폰 */
        @media (max-width: 600px) {

            .glass {
                width: 90vw;
                padding: 32px 20px;
                border-radius: 28px;
            }

            #time {
                font-size: 65px;
                letter-spacing: -4px;
            }

            input {
                width: 105px;
            }

            .buttons {
                flex-wrap: wrap;
            }

            button {
                flex: 1;
                min-width: 90px;
            }
        }
    </style>
</head>

<body>

    <main class="glass">

        <h1>Timer</h1>

        <div id="time">00:00</div>

        <div class="inputs">
            <input
                id="minutes"
                type="number"
                min="0"
                placeholder="분"
            >

            <input
                id="seconds"
                type="number"
                min="0"
                max="59"
                placeholder="초"
            >
        </div>

        <div class="buttons">
            <button onclick="startTimer()">시작</button>
            <button onclick="pauseTimer()">일시정지</button>
            <button onclick="resetTimer()">초기화</button>
        </div>

    </main>

    <script>
        let totalSeconds = 0;
        let timer = null;

        const timeDisplay = document.getElementById("time");
        const minutesInput = document.getElementById("minutes");
        const secondsInput = document.getElementById("seconds");

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            timeDisplay.textContent =
                String(minutes).padStart(2, "0") +
                ":" +
                String(seconds).padStart(2, "0");
        }

        function startTimer() {

            if (timer !== null) {
                return;
            }

            if (totalSeconds === 0) {

                const minutes =
                    Number(minutesInput.value) || 0;

                const seconds =
                    Number(secondsInput.value) || 0;

                totalSeconds =
                    minutes * 60 + seconds;
            }

            if (totalSeconds <= 0) {
                return;
            }

            timeDisplay.classList.remove("finished");

            timer = setInterval(() => {

                totalSeconds--;

                updateDisplay();

                if (totalSeconds <= 0) {

                    clearInterval(timer);
                    timer = null;

                    timeDisplay.classList.add("finished");

                    alert("시간이 끝났습니다!");
                }

            }, 1000);
        }

        function pauseTimer() {

            if (timer !== null) {
                clearInterval(timer);
                timer = null;
            }
        }

        function resetTimer() {

            clearInterval(timer);

            timer = null;
            totalSeconds = 0;

            timeDisplay.classList.remove("finished");

            minutesInput.value = "";
            secondsInput.value = "";

            updateDisplay();
        }
    </script>

</body>
</html>
