<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "Pretendard","Segoe UI",sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* 메인 */

.app{
    width:min(90vw,520px);
    text-align:center;
}

.title{
    font-size:30px;
    font-weight:700;
    letter-spacing:-1px;
    margin-bottom:30px;
}

.time{
    font-size:clamp(72px,18vw,105px);
    font-weight:700;
    letter-spacing:-6px;
    font-variant-numeric:tabular-nums;
    margin-bottom:28px;
    transition:transform .18s ease;
}

.time.pop{
    transform:scale(1.035);
}

.controls{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

.primary{
    background:#fff;
    color:#000;
    padding:15px 28px;
    border-radius:17px;
    font-size:16px;
    font-weight:600;
    transition:transform .18s ease;
}

.primary:hover{
    transform:scale(1.035);
}

.primary:active{
    transform:scale(.96);
}

.secondary{
    background:#1c1c1e;
    color:#fff;
    border:1px solid #303034;
    padding:15px 20px;
    border-radius:17px;
    font-size:15px;
}

.settings{
    margin-top:24px;
    padding:16px;
    border-radius:20px;
    background:#111;
    border:1px solid #222;
    opacity:0;
    transform:translateY(8px);
    pointer-events:none;
    transition:opacity .3s ease,transform .3s ease;
}

.settings.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.settings-title{
    color:#999;
    font-size:12px;
    margin-bottom:10px;
}

input{
    outline:none;
    font-family:inherit;
}

.time-input{
    width:110px;
    height:44px;
    border-radius:12px;
    border:1px solid #3a3a3c;
    background:#1c1c1e;
    color:#fff;
    text-align:center;
    font-size:16px;
    padding:0 10px;
}

.set{
    height:44px;
    padding:0 17px;
    margin-left:5px;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-weight:600;
}


/* 결제 배경 */

.modal{
    position:fixed;
    inset:0;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    padding:12px;
    background:rgba(0,0,0,0);
    backdrop-filter:blur(0);
    -webkit-backdrop-filter:blur(0);
    pointer-events:none;
    opacity:0;
    transition:
        opacity .35s ease,
        background .35s ease,
        backdrop-filter .35s ease;
    z-index:10;
}

.modal.open{
    opacity:1;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    pointer-events:auto;
}


/* 결제 시트 */

.sheet{
    position:relative;
    width:min(100%,450px);
    max-height:94vh;
    overflow:auto;
    padding:23px;
    border-radius:30px;
    background:#1c1c1e;
    border:1px solid #38383a;
    box-shadow:0 -20px 70px rgba(0,0,0,.5);

    transform:translateY(45px) scale(.98);
    opacity:0;
    transition:
        transform .42s cubic-bezier(.22,.8,.22,1),
        opacity .3s ease;
}

.modal.open .sheet{
    transform:translateY(0) scale(1);
    opacity:1;
}

.handle{
    width:38px;
    height:5px;
    background:#555;
    border-radius:10px;
    margin:0 auto 20px;
}


/* X */

.close{
    position:absolute;
    top:19px;
    right:19px;

    width:32px;
    height:32px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#303034;
    color:#aaa;

    font-size:20px;
    line-height:1;

    transition:
        left .18s ease,
        top .18s ease,
        transform .18s ease;
}

.close:hover{
    transform:scale(1.05);
}


/* 결제 내용 */

.store{
    text-align:center;
    font-size:17px;
    font-weight:600;
    margin-bottom:22px;
}

.product{
    text-align:center;
    padding-bottom:20px;
    border-bottom:1px solid #38383a;
}

.product-name{
    font-size:24px;
    font-weight:700;
    letter-spacing:-.7px;
}

.sub{
    color:#98989d;
    font-size:13px;
    margin-top:7px;
}

.price{
    text-align:center;
    font-size:40px;
    font-weight:700;
    letter-spacing:-1.5px;
    padding:21px 0;
}

.billing{
    display:block;
    color:#98989d;
    font-size:12px;
    font-weight:400;
    margin-top:5px;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #38383a;
}

.label{
    color:#98989d;
    font-size:13px;
}

.value{
    font-size:12px;
}

.benefits{
    padding:15px 0;
    border-bottom:1px solid #38383a;
}

.benefit{
    font-size:13px;
    margin:8px 0;
}

.buy{
    width:100%;
    height:54px;
    margin-top:19px;
    border-radius:15px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:600;
    transition:transform .18s ease;
}

.buy:active{
    transform:scale(.97);
}


/* 인증 */

.password-screen,
.loading,
.success{
    display:none;
    text-align:center;
}

.password-screen{
    padding:15px 4px 4px;
}

.icon{
    font-size:38px;
    margin-bottom:15px;
}

.password-screen h2,
.loading h2,
.success h2{
    margin:0 0 8px;
    font-size:22px;
}

.password-screen p,
.loading p,
.success p{
    color:#98989d;
    font-size:13px;
    line-height:1.6;
    margin:0 0 20px;
}

.password{
    width:100%;
    height:50px;
    border-radius:13px;
    border:1px solid #444;
    background:#2c2c2e;
    color:#fff;
    text-align:center;
    font-size:16px;
    padding:0 15px;
}

.confirm{
    width:100%;
    height:52px;
    margin-top:12px;
    border-radius:14px;
    background:#fff;
    color:#000;
    font-weight:600;
}


/* 로딩 */

.loading{
    padding:35px 4px;
}

.spinner{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid #444;
    border-top-color:#fff;
    margin:0 auto 19px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}


/* 완료 */

.success{
    padding:30px 4px;
}

.check{
    width:68px;
    height:68px;
    margin:0 auto 19px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#fff;
    color:#000;
    font-size:34px;
}


/* 모바일 */

@media(max-width:500px){
    .sheet{
        padding:21px;
        border-radius:28px;
    }

    .price{
        font-size:37px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="title">Timer</div>

    <div class="time" id="time">00:03</div>

    <div class="controls">

        <button class="primary" onclick="startTimer()">
            시작
        </button>

        <button class="secondary" onclick="pauseTimer()">
            일시정지
        </button>

        <button class="secondary" onclick="resetTimer()">
            초기화
        </button>

    </div>

    <!-- 결제 후에만 나타남 -->

    <div class="settings" id="settings">

        <div class="settings-title">
            타이머 시간
        </div>

        <input
            class="time-input"
            id="timeInput"
            type="number"
            min="1"
            max="9999"
            value="3"
        >

        <button class="set" onclick="setTime()">
            설정
        </button>

    </div>

</div>


<!-- 결제창 -->

<div class="modal" id="modal">

    <div class="sheet" id="sheet">

        <div class="handle"></div>

        <!-- X 버튼 -->
        <button
            class="close"
            id="closeButton"
            onmouseenter="escapeClose()"
            onclick="cancelPayment()"
        >
            ×
        </button>


        <!-- 결제 정보 -->

        <div id="paymentInfo">

            <div class="store">
                App Store
            </div>

            <div class="product">

                <div class="product-name">
                    3초 타이머 프리미엄
                </div>

                <div class="sub">
                    앱 내 구입 · 일회성
                </div>

            </div>

            <div class="price">

                ₩100,000

                <span class="billing">
                    일회성 청구
                </span>

            </div>

            <div class="info">

                <div class="label">
                    구매 계정
                </div>

                <div class="value">
                    chunhe0208@icloud.com
                </div>

            </div>

            <div class="info">

                <div class="label">
                    결제 수단
                </div>

                <div class="value">
                    등록된 결제 수단
                </div>

            </div>

            <div class="benefits">

                <div class="benefit">
                    ✓ 3초 타이머 무제한 사용
                </div>

                <div class="benefit">
                    ✓ 광고 없음
                </div>

            </div>

            <button
                class="buy"
                onclick="showPassword()"
            >
                ₩100,000 구매
            </button>

        </div>


        <!-- 암호 -->

        <div
            class="password-screen"
            id="passwordScreen"
        >

            <div class="icon">🔒</div>

            <h2>
                구매 인증
            </h2>

            <p>
                계속하려면 암호를 입력하세요.
            </p>

            <input
                class="password"
                id="password"
                type="password"
                autocomplete="off"
                placeholder="암호"
            >

            <button
                class="confirm"
                onclick="confirmPassword()"
            >
                계속
            </button>

        </div>


        <!-- 결제 처리 -->

        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <h2>
                결제 처리 중
            </h2>

            <p>
                잠시만 기다려 주세요.
            </p>

        </div>


        <!-- 완료 -->

        <div
            class="success"
            id="success"
        >

            <div class="check">
                ✓
            </div>

            <h2>
                구매 완료
            </h2>

            <p>
                프리미엄 이용권이 활성화되었습니다.<br>
                이제 타이머를 무제한으로 사용할 수 있습니다.
            </p>

        </div>

    </div>
</div>


<!--
나중에 같은 폴더에 yarson.mp3를 넣으면
아래 주석을 풀고 연결할 수 있음.

<audio id="yarson" src="yarson.mp3"></audio>
-->


<script>

let timer = null;
let lastFrame = null;

let defaultSeconds = 3;
let remaining = 3;

let running = false;
let premium = false;


/* -------------------------
   시간 표시
------------------------- */

function updateDisplay(){

    const minutes =
        Math.floor(remaining / 60);

    const seconds =
        Math.floor(remaining % 60);

    document.getElementById("time").textContent =
        String(minutes).padStart(2,"0")
        + ":"
        + String(seconds).padStart(2,"0");
}


/* -------------------------
   부드러운 타이머
------------------------- */

function tick(now){

    if(!running) return;

    if(!lastFrame){
        lastFrame = now;
    }

    const elapsed =
        (now - lastFrame) / 1000;

    if(elapsed >= 1){

        const steps =
            Math.floor(elapsed);

        remaining -= steps;

        lastFrame += steps * 1000;

        if(remaining <= 0){

            remaining = 0;

            updateDisplay();

            running = false;
            lastFrame = null;

            timer = null;

            if(premium){

                remaining = defaultSeconds;

                updateDisplay();

            }else{

                setTimeout(openPayment,250);
            }

            return;
        }

        updateDisplay();
    }

    timer =
        requestAnimationFrame(tick);
}


/* -------------------------
   시작
------------------------- */

function startTimer(){

    if(running) return;

    running = true;
    lastFrame = null;

    timer =
        requestAnimationFrame(tick);
}


/* -------------------------
   일시정지
------------------------- */

function pauseTimer(){

    if(!running) return;

    running = false;

    if(timer !== null){

        cancelAnimationFrame(timer);

        timer = null;
    }

    lastFrame = null;
}


/* -------------------------
   초기화
------------------------- */

function resetTimer(){

    pauseTimer();

    remaining = defaultSeconds;

    updateDisplay();
}


/* -------------------------
   시간 설정
   결제 후에만 가능
------------------------- */

function setTime(){

    if(!premium) return;

    let value =
        Number(
            document.getElementById("timeInput").value
        );

    if(!value || value < 1) return;

    value =
        Math.min(value,9999);

    defaultSeconds = value;

    resetTimer();
}


/* -------------------------
   결제창
------------------------- */

function openPayment(){

    document.getElementById("modal")
        .classList.add("open");
}


/* -------------------------
   X 도망
------------------------- */

function escapeClose(){

    const button =
        document.getElementById("closeButton");

    const sheet =
        document.getElementById("sheet");

    const rect =
        sheet.getBoundingClientRect();

    const maxX =
        Math.max(0,rect.width - 55);

    const maxY =
        Math.max(0,rect.height - 55);

    const x =
        Math.random() * maxX;

    const y =
        Math.random() * maxY;

    button.style.position = "absolute";

    button.style.left = x + "px";
    button.style.top = y + "px";
}


/* -------------------------
   결제 취소
------------------------- */

function cancelPayment(){

    /*
      나중에 yarson.mp3를 넣으면
      여기에서 재생하도록 연결 가능.

      const sound =
          document.getElementById("yarson");

      sound.currentTime = 0;
      sound.play();
    */

    closePayment();
}


/* -------------------------
   결제창 닫기
------------------------- */

function closePayment(){

    document.getElementById("modal")
        .classList.remove("open");

    setTimeout(resetPaymentScreen,400);
}


/* -------------------------
   결제 화면 초기화
------------------------- */

function resetPaymentScreen(){

    document.getElementById("paymentInfo")
        .style.display = "block";

    document.getElementById("passwordScreen")
        .style.display = "none";

    document.getElementById("loading")
        .style.display = "none";

    document.getElementById("success")
        .style.display = "none";

    document.getElementById("password")
        .value = "";

    const button =
        document.getElementById("closeButton");

    button.style.position = "";
    button.style.left = "";
    button.style.top = "";
}


/* -------------------------
   구매 버튼
------------------------- */

function showPassword(){

    document.getElementById("paymentInfo")
        .style.display = "none";

    document.getElementById("passwordScreen")
        .style.display = "block";

    setTimeout(()=>{

        document.getElementById("password")
            .focus();

    },100);
}


/* -------------------------
   암호 확인
------------------------- */

function confirmPassword(){

    const password =
        document.getElementById("password").value;

    /*
      자체 모의 인증.
      어떤 문자열이든 입력하면 진행.
      입력값은 저장하거나 전송하지 않음.
    */

    if(password.length === 0) return;


    document.getElementById("passwordScreen")
        .style.display = "none";

    document.getElementById("loading")
        .style.display = "block";


    setTimeout(()=>{

        document.getElementById("loading")
            .style.display = "none";

        document.getElementById("success")
            .style.display = "block";

        premium = true;

        document.getElementById("settings")
            .classList.add("show");


        /* 구매 완료 화면 */

        setTimeout(()=>{

            closePayment();

        },3000);

    },2200);
}


/* 초기 화면 */

updateDisplay();

</script>

</body>
</html>
