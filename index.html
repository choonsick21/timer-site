<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        sans-serif;

    background: #000;
    color: #fff;
}


/* =========================
   TIMER
========================= */

.timer {
    width: min(90vw, 500px);

    text-align: center;
}

.title {
    font-size: 30px;
    font-weight: 700;

    margin-bottom: 35px;

    letter-spacing: -1px;
}

.time {
    font-size: 96px;
    font-weight: 700;

    letter-spacing: -6px;

    margin-bottom: 38px;

    font-variant-numeric: tabular-nums;
}

.start {
    border: none;

    padding: 17px 45px;

    border-radius: 18px;

    background: #fff;
    color: #000;

    font-size: 17px;
    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.start:hover {
    transform: scale(1.04);
}

.start:active {
    transform: scale(.96);
}


/* =========================
   MODAL
========================= */

.modal {
    position: fixed;

    inset: 0;

    display: none;

    align-items: flex-end;
    justify-content: center;

    background: rgba(0,0,0,.62);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    padding: 12px;
}


/* =========================
   SHEET
========================= */

.sheet {
    width: min(100%, 440px);

    background: #1c1c1e;

    border-radius: 30px;

    padding: 25px 24px 28px;

    box-shadow:
        0 -10px 50px rgba(0,0,0,.5);

    animation:
        slideUp .35s cubic-bezier(.2,.8,.2,1);
}

@keyframes slideUp {

    from {
        transform: translateY(100%);
        opacity: 0;
    }

    to {
        transform: translateY(0);
        opacity: 1;
    }
}


/* 위 손잡이 */

.handle {
    width: 38px;
    height: 5px;

    margin: 0 auto 23px;

    border-radius: 10px;

    background: #555;
}


/* =========================
   STORE
========================= */

.store {
    text-align: center;

    font-size: 17px;
    font-weight: 600;

    margin-bottom: 24px;
}

.demo {
    display: inline-block;

    margin-top: 8px;

    padding: 4px 8px;

    border-radius: 7px;

    background: #2c2c2e;

    color: #999;

    font-size: 10px;
}


/* =========================
   PRODUCT
========================= */

.product {
    text-align: center;

    padding-bottom: 22px;

    border-bottom: 1px solid #38383a;
}

.product-name {
    font-size: 24px;
    font-weight: 700;

    letter-spacing: -.7px;
}

.product-sub {
    margin-top: 7px;

    color: #98989d;

    font-size: 13px;
}


/* =========================
   PRICE
========================= */

.price-box {
    text-align: center;

    padding: 22px 0 20px;
}

.price {
    font-size: 40px;
    font-weight: 700;

    letter-spacing: -1.5px;
}

.once {
    margin-top: 5px;

    color: #98989d;

    font-size: 12px;
}


/* =========================
   ACCOUNT
========================= */

.info {
    display: flex;

    justify-content: space-between;
    align-items: center;

    padding: 15px 0;

    border-bottom: 1px solid #38383a;
}

.info-label {
    color: #98989d;

    font-size: 13px;
}

.info-value {
    color: #fff;

    font-size: 12px;
}


/* =========================
   BENEFITS
========================= */

.benefits {
    padding: 18px 0;

    border-bottom: 1px solid #38383a;
}

.benefit {
    display: flex;

    align-items: center;

    gap: 9px;

    margin: 9px 0;

    font-size: 13px;
}

.dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #fff;
}


/* =========================
   BUY
========================= */

.buy {
    width: 100%;

    height: 54px;

    margin-top: 20px;

    border: none;

    border-radius: 15px;

    background: #fff;

    color: #000;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition: .2s;
}

.buy:active {
    transform: scale(.97);
}


/* =========================
   PASSWORD
========================= */

.password-screen {
    display: none;

    text-align: center;

    padding: 15px 5px 5px;
}

.lock {
    font-size: 42px;

    margin-bottom: 17px;
}

.password-screen h2 {
    margin: 0;

    font-size: 23px;
}

.password-screen p {
    margin: 9px 0 20px;

    color: #98989d;

    font-size: 13px;
}

.password {
    width: 100%;

    height: 50px;

    padding: 0 15px;

    border: 1px solid #48484a;

    border-radius: 13px;

    outline: none;

    background: #2c2c2e;

    color: white;

    font-size: 16px;

    text-align: center;
}

.password:focus {
    border-color: #888;
}

.confirm {
    width: 100%;

    height: 52px;

    margin-top: 12px;

    border: none;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-weight: 600;

    cursor: pointer;
}


/* =========================
   PROCESS
========================= */

.process {
    display: none;

    text-align: center;

    padding: 35px 5px;
}

.spinner {
    width: 35px;
    height: 35px;

    margin: 0 auto 20px;

    border-radius: 50%;

    border: 3px solid #444;

    border-top-color: #fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.process h2 {
    margin: 0 0 8px;

    font-size: 21px;
}

.process p {
    margin: 0;

    color: #98989d;

    font-size: 13px;
}


/* =========================
   SUCCESS
========================= */

.success {
    display: none;

    text-align: center;

    padding: 30px 5px;
}

.success-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #fff;

    color: #000;

    font-size: 34px;
}

.success h2 {
    margin: 0 0 8px;

    font-size: 23px;
}

.success p {
    margin: 0;

    color: #98989d;

    font-size: 13px;

    line-height: 1.6;
}
</style>
</head>


<body>


<!-- TIMER -->

<div class="timer">

    <div class="title">
        Timer
    </div>

    <div
        class="time"
        id="time"
    >
        00:03
    </div>

    <button
        class="start"
        onclick="startTimer()"
    >
        3초 카운트
    </button>

</div>



<!-- PAYMENT -->

<div
    class="modal"
    id="modal"
>

    <div class="sheet">

        <div class="handle"></div>


        <!-- PAYMENT INFO -->

        <div id="paymentInfo">

            <div class="store">

                App Store

                <br>

                <span class="demo">
                    모의 결제
                </span>

            </div>


            <div class="product">

                <div class="product-name">
                    3초 타이머 프리미엄
                </div>

                <div class="product-sub">
                    앱 내 구입 · 일회성
                </div>

            </div>


            <div class="price-box">

                <div class="price">
                    ₩100,000
                </div>

                <div class="once">
                    일회성 청구
                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    구매 계정
                </div>

                <div class="info-value">
                    chunhe0208@icloud.com
                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    결제 수단
                </div>

                <div class="info-value">
                    등록된 결제 수단
                </div>

            </div>


            <div class="benefits">

                <div class="benefit">
                    <span class="dot"></span>
                    3초 타이머 무제한 사용
                </div>

                <div class="benefit">
                    <span class="dot"></span>
                    광고 없음
                </div>

            </div>


            <button
                class="buy"
                onclick="showPassword()"
            >
                ₩100,000 구매
            </button>

        </div>



        <!-- PASSWORD -->

        <div
            class="password-screen"
            id="passwordScreen"
        >

            <div class="lock">
                🔒
            </div>

            <h2>
                구매 인증
            </h2>

            <p>
                계속하려면 암호를 입력하세요.
            </p>

            <input
                class="password"
                id="password"
                type="password"
                placeholder="암호"
                autocomplete="off"
            >

            <button
                class="confirm"
                onclick="confirmPassword()"
            >
                계속
            </button>

        </div>



        <!-- PROCESS -->

        <div
            class="process"
            id="process"
        >

            <div class="spinner"></div>

            <h2>
                결제 처리 중
            </h2>

            <p>
                잠시만 기다려 주세요.
            </p>

        </div>



        <!-- SUCCESS -->

        <div
            class="success"
            id="success"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                구매 완료
            </h2>

            <p>
                프리미엄 이용권이 활성화되었습니다.<br>
                3초 타이머를 무제한으로 사용할 수 있습니다.
            </p>

        </div>

    </div>

</div>



<script>

let timer = null;
let premium = false;


/* =========================
   EFFECT SOUND
========================= */

function playPaymentSound() {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const ctx =
        new AudioContext();

    const osc =
        ctx.createOscillator();

    const gain =
        ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type = "sine";

    osc.frequency.setValueAtTime(
        880,
        ctx.currentTime
    );

    osc.frequency.exponentialRampToValueAtTime(
        1320,
        ctx.currentTime + .13
    );

    gain.gain.setValueAtTime(
        .08,
        ctx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        ctx.currentTime + .22
    );

    osc.start();

    osc.stop(
        ctx.currentTime + .22
    );
}


/* =========================
   TIMER
========================= */

function startTimer() {

    if (timer !== null) return;

    let count = 3;

    document.getElementById("time").textContent =
        "00:03";


    timer = setInterval(() => {

        count--;

        if (count > 0) {

            document.getElementById("time").textContent =
                "00:0" + count;

        } else {

            clearInterval(timer);

            timer = null;

            document.getElementById("time").textContent =
                "00:00";


            setTimeout(() => {

                if (premium) {

                    startTimer();

                } else {

                    openPayment();

                }

            }, 400);

        }

    }, 1000);
}


/* =========================
   OPEN PAYMENT
========================= */

function openPayment() {

    document.getElementById("modal").style.display =
        "flex";
}


/* =========================
   PASSWORD SCREEN
========================= */

function showPassword() {

    document.getElementById("paymentInfo").style.display =
        "none";

    document.getElementById("passwordScreen").style.display =
        "block";

    setTimeout(() => {

        document.getElementById("password").focus();

    }, 100);
}


/* =========================
   PASSWORD CONFIRM
========================= */

function confirmPassword() {

    const password =
        document.getElementById("password").value;


    /*
       모의 인증:
       어떤 문자열을 입력해도 통과.
       입력값은 저장하거나 전송하지 않음.
    */

    if (password.length === 0) {

        return;

    }


    document.getElementById("passwordScreen").style.display =
        "none";

    document.getElementById("process").style.display =
        "block";


    /* 결제 처리 */

    setTimeout(() => {

        document.getElementById("process").style.display =
            "none";

        document.getElementById("success").style.display =
            "block";

        premium = true;

        playPaymentSound();


        /* 3초 뒤 자동 종료 */

        setTimeout(() => {

            document.getElementById("modal").style.display =
                "none";

            document.getElementById("success").style.display =
                "none";

            document.getElementById("paymentInfo").style.display =
                "block";

            document.getElementById("password").value =
                "";

        }, 3000);

    }, 2200);
}

</script>

</body>
</html>
