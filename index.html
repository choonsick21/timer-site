<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        "Segoe UI",
        sans-serif;

    color: white;

    background:
        radial-gradient(circle at 50% 0%, #252525 0%, #090909 45%, #000 100%);
}

/* 타이머 */

.timer-card {
    width: min(92vw, 520px);
    padding: 48px 40px;

    text-align: center;

    background: rgba(35,35,35,.58);

    border: 1px solid rgba(255,255,255,.12);

    border-radius: 38px;

    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.55),
        inset 0 1px 1px rgba(255,255,255,.08);
}

.timer-title {
    margin: 0 0 30px;

    font-size: 29px;
    font-weight: 700;
}

#time {
    margin-bottom: 35px;

    font-size: clamp(70px, 16vw, 100px);
    font-weight: 700;

    letter-spacing: -6px;

    font-variant-numeric: tabular-nums;
}

.timer-button {
    width: 220px;
    height: 62px;

    border: 0;
    border-radius: 20px;

    background: #fff;
    color: #000;

    font-size: 18px;
    font-weight: 650;

    cursor: pointer;

    transition:
        transform .25s cubic-bezier(.2,.8,.2,1),
        box-shadow .25s ease;
}

.timer-button:hover {
    transform: scale(1.07);

    box-shadow:
        0 15px 35px rgba(255,255,255,.15);
}

.timer-button:active {
    transform: scale(.95);
}


/* 결제 배경 */

.modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.72);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    animation: fade .35s ease;
}

@keyframes fade {
    from { opacity: 0; }
    to { opacity: 1; }
}


/* 결제창 */

.payment {
    width: min(94vw, 460px);

    padding: 27px;

    background:
        linear-gradient(
            145deg,
            rgba(48,48,48,.95),
            rgba(20,20,20,.97)
        );

    border: 1px solid rgba(255,255,255,.14);

    border-radius: 34px;

    box-shadow:
        0 40px 120px rgba(0,0,0,.7),
        inset 0 1px 1px rgba(255,255,255,.08);

    animation:
        paymentAppear .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes paymentAppear {
    from {
        opacity: 0;
        transform:
            translateY(25px)
            scale(.94);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}


/* 상단 */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 27px;
}

.logo {
    font-size: 17px;
    font-weight: 700;
}

.demo {
    padding: 6px 9px;

    border-radius: 9px;

    background: rgba(255,255,255,.08);

    color: #aaa;

    font-size: 10px;
    font-weight: 600;
}


/* 상품 */

.product {
    padding-bottom: 23px;

    border-bottom:
        1px solid rgba(255,255,255,.09);
}

.product-name {
    font-size: 24px;
    font-weight: 700;

    letter-spacing: -.7px;
}

.product-description {
    margin-top: 7px;

    color: #999;

    font-size: 13px;
}


/* 가격 */

.price-area {
    padding: 24px 0 20px;
}

.price {
    font-size: 42px;
    font-weight: 750;

    letter-spacing: -2px;
}

.billing {
    margin-top: 4px;

    color: #888;

    font-size: 12px;
}


/* 계정 */

.account {
    margin-bottom: 15px;
    padding: 15px 17px;

    border-radius: 17px;

    background: rgba(255,255,255,.055);

    display: flex;
    justify-content: space-between;
    align-items: center;
}

.account-label {
    color: #888;
    font-size: 12px;
}

.account-id {
    font-size: 12px;
    color: #ddd;
}


/* 결제 수단 */

.method-title {
    margin: 18px 0 9px;

    color: #888;

    font-size: 12px;
}

.method {
    padding: 15px 17px;

    border-radius: 17px;

    background: rgba(255,255,255,.055);

    display: flex;
    align-items: center;
    justify-content: space-between;

    border: 1px solid rgba(255,255,255,.07);
}

.method-left {
    display: flex;
    align-items: center;
    gap: 11px;
}

.card-icon {
    width: 34px;
    height: 24px;

    border-radius: 6px;

    background: linear-gradient(
        145deg,
        #ddd,
        #777
    );

    position: relative;
}

.card-icon::after {
    content: "";

    position: absolute;

    left: 5px;
    right: 5px;
    bottom: 5px;

    height: 3px;

    border-radius: 2px;

    background: #333;
}

.method-name {
    font-size: 13px;
}

.check {
    width: 20px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;
    color: black;

    font-size: 12px;
}


/* 구매 버튼 */

.buy {
    width: 100%;
    height: 56px;

    margin-top: 22px;

    border: 0;
    border-radius: 18px;

    background: white;
    color: black;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.buy:hover {
    transform: scale(1.025);

    box-shadow:
        0 10px 30px rgba(255,255,255,.12);
}

.buy:active {
    transform: scale(.97);
}


/* 인증 */

.auth {
    display: none;

    text-align: center;

    padding: 25px 10px 15px;
}

.face {
    width: 78px;
    height: 78px;

    margin: 10px auto 24px;

    border: 2px solid #fff;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 31px;

    animation:
        faceScan 1.8s infinite;
}

@keyframes faceScan {
    0%,100% {
        box-shadow:
            0 0 0 rgba(255,255,255,0);
    }

    50% {
        box-shadow:
            0 0 35px rgba(255,255,255,.18);
    }
}

.auth h2 {
    margin: 0 0 8px;

    font-size: 23px;
}

.auth p {
    margin: 0;

    color: #888;

    font-size: 13px;
}


/* 결제중 */

.loading {
    display: none;

    text-align: center;

    padding: 35px 10px;
}

.spinner {
    width: 48px;
    height: 48px;

    margin: 0 auto 23px;

    border-radius: 50%;

    border: 4px solid #444;
    border-top-color: white;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading h2 {
    margin: 0 0 8px;

    font-size: 22px;
}

.loading p {
    margin: 0;

    color: #888;

    font-size: 13px;
}


/* 완료 */

.success {
    display: none;

    text-align: center;

    padding: 30px 10px;
}

.success-icon {
    width: 70px;
    height: 70px;

    margin: 0 auto 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;
    color: black;

    font-size: 35px;

    animation:
        pop .5s cubic-bezier(.2,1.5,.4,1);
}

@keyframes pop {
    from {
        transform: scale(0);
    }

    to {
        transform: scale(1);
    }
}

.success h2 {
    margin: 0 0 9px;

    font-size: 24px;
}

.success p {
    margin: 0;

    color: #888;

    font-size: 13px;
    line-height: 1.6;
}


/* 모바일 */

@media(max-width:500px) {

    .timer-card {
        padding: 38px 20px;
        border-radius: 30px;
    }

    .payment {
        padding: 23px;
        border-radius: 30px;
    }

    .price {
        font-size: 38px;
    }
}
</style>
</head>


<body>


<!-- 타이머 -->

<div class="timer-card">

    <div class="timer-title">
        Timer
    </div>

    <div id="time">
        00:03
    </div>

    <button
        class="timer-button"
        onclick="startTimer()"
    >
        3초 카운트
    </button>

</div>



<!-- 결제창 -->

<div
    class="modal"
    id="modal"
>

    <div class="payment">


        <!-- 결제 정보 -->

        <div id="paymentInfo">

            <div class="top">

                <div class="logo">
                    App Store
                </div>

                <div class="demo">
                    모의 결제
                </div>

            </div>


            <div class="product">

                <div class="product-name">
                    3초 타이머 프리미엄
                </div>

                <div class="product-description">
                    앱 내 구입 · 일회성
                </div>

            </div>


            <div class="price-area">

                <div class="price">
                    ₩100,000
                </div>

                <div class="billing">
                    일회성 청구
                </div>

            </div>


            <!-- 계정 -->

            <div class="account">

                <div class="account-label">
                    구매 계정
                </div>

                <div class="account-id">
                    user@example.com
                </div>

            </div>


            <!-- 결제 수단 -->

            <div class="method-title">
                결제 수단
            </div>

            <div class="method">

                <div class="method-left">

                    <div class="card-icon"></div>

                    <div class="method-name">
                        등록된 결제 수단
                    </div>

                </div>

                <div class="check">
                    ✓
                </div>

            </div>


            <button
                class="buy"
                onclick="authenticate()"
            >
                ₩100,000 구매
            </button>

        </div>



        <!-- 인증 -->

        <div
            class="auth"
            id="auth"
        >

            <div class="face">
                ◉
            </div>

            <h2>
                인증 중
            </h2>

            <p>
                본인 확인을 진행하고 있습니다
            </p>

        </div>



        <!-- 결제 처리 -->

        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <h2>
                결제 처리 중
            </h2>

            <p>
                잠시만 기다려 주세요
            </p>

        </div>



        <!-- 완료 -->

        <div
            class="success"
            id="success"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                구매 완료
            </h2>

            <p>
                프리미엄 이용권이 활성화되었습니다.<br>
                3초 타이머를 무제한으로 사용할 수 있습니다.
            </p>

        </div>

    </div>

</div>



<script>

let timer = null;
let premium = false;


/* 효과음 */

function sound(type) {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audio = new AudioContext();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);


    if (type === "tick") {

        oscillator.frequency.value = 620;

        gain.gain.setValueAtTime(
            0.08,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + .12
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + .12
        );
    }


    if (type === "success") {

        oscillator.frequency.setValueAtTime(
            520,
            audio.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            780,
            audio.currentTime + .25
        );

        gain.gain.setValueAtTime(
            0.1,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + .4
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + .4
        );
    }
}


/* 3초 타이머 */

function startTimer() {

    if (timer !== null) return;

    let count = 3;

    document.getElementById("time").textContent =
        "00:0" + count;

    sound("tick");


    timer = setInterval(() => {

        count--;

        if (count > 0) {

            document.getElementById("time").textContent =
                "00:0" + count;

            sound("tick");

        } else {

            clearInterval(timer);
            timer = null;

            document.getElementById("time").textContent =
                "00:00";


            setTimeout(() => {

                if (premium) {

                    startTimer();

                } else {

                    openPayment();

                }

            }, 350);
        }

    }, 1000);
}


/* 결제창 */

function openPayment() {

    document.getElementById("modal").style.display =
        "flex";
}


/* 인증 */

function authenticate() {

    document.getElementById("paymentInfo").style.display =
        "none";

    document.getElementById("auth").style.display =
        "block";


    setTimeout(() => {

        document.getElementById("auth").style.display =
            "none";

        document.getElementById("loading").style.display =
            "block";


        setTimeout(() => {

            document.getElementById("loading").style.display =
                "none";

            document.getElementById("success").style.display =
                "block";

            premium = true;

            sound("success");

        }, 2200);

    }, 1800);
}

</script>

</body>
</html>
