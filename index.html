<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer</title>

<style>

/* =========================
   기본
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    background: #000;

    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        "Segoe UI",
        sans-serif;

    display: flex;

    align-items: center;
    justify-content: center;

    overflow: hidden;

    -webkit-font-smoothing: antialiased;
}


/* =========================
   메인
========================= */

.app {

    width: min(90vw, 520px);

    text-align: center;
}

.title {

    font-size: 30px;

    font-weight: 700;

    letter-spacing: -1px;

    margin-bottom: 32px;
}

.time {

    font-size: clamp(75px, 18vw, 105px);

    font-weight: 700;

    letter-spacing: -6px;

    font-variant-numeric: tabular-nums;

    line-height: 1;

    margin-bottom: 32px;

    user-select: none;

    transition:
        transform .2s ease;
}

.time.pop {

    transform: scale(1.025);
}


/* =========================
   버튼
========================= */

.controls {

    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 9px;
}

button {

    font-family: inherit;

    border: none;

    cursor: pointer;
}

.primary {

    padding: 15px 28px;

    border-radius: 17px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 600;

    transition:
        transform .18s ease,
        opacity .18s ease;
}

.primary:hover {

    transform: scale(1.035);
}

.primary:active {

    transform: scale(.96);
}

.secondary {

    padding: 15px 20px;

    border-radius: 17px;

    background: #1c1c1e;

    color: #fff;

    border: 1px solid #303034;

    font-size: 15px;

    transition:
        background .2s ease,
        transform .18s ease;
}

.secondary:hover {

    background: #29292b;
}

.secondary:active {

    transform: scale(.96);
}


/* =========================
   설정
========================= */

.settings {

    margin-top: 25px;

    padding: 17px;

    border-radius: 21px;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.08);

    opacity: 0;

    transform: translateY(8px);

    pointer-events: none;

    transition:
        opacity .4s ease,
        transform .4s ease;
}

.settings.show {

    opacity: 1;

    transform: translateY(0);

    pointer-events: auto;
}

.settings-title {

    color: #98989d;

    font-size: 12px;

    margin-bottom: 10px;
}

.time-input {

    width: 110px;

    height: 45px;

    border-radius: 13px;

    border: 1px solid #3a3a3c;

    background: #1c1c1e;

    color: #fff;

    outline: none;

    text-align: center;

    font-size: 16px;

    padding: 0 10px;
}

.set {

    height: 45px;

    margin-left: 5px;

    padding: 0 18px;

    border-radius: 13px;

    background: #fff;

    color: #000;

    font-weight: 600;

    transition: transform .18s ease;
}

.set:active {

    transform: scale(.95);
}


/* =========================
   결제 배경
========================= */

.modal {

    position: fixed;

    inset: 0;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    padding: 12px;

    background: rgba(0,0,0,0);

    backdrop-filter: blur(0);

    -webkit-backdrop-filter: blur(0);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .42s ease,
        background .42s ease,
        backdrop-filter .42s ease,
        -webkit-backdrop-filter .42s ease;

    z-index: 100;
}

.modal.open {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    background: rgba(0,0,0,.64);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);
}


/* =========================
   결제창
========================= */

.sheet {

    position: relative;

    width: min(100%, 450px);

    max-height: 94vh;

    overflow-y: auto;

    padding: 23px;

    border-radius: 30px;

    background:
        linear-gradient(
            145deg,
            rgba(40,40,42,.98),
            rgba(25,25,27,.98)
        );

    border: 1px solid rgba(255,255,255,.11);

    box-shadow:
        0 -25px 90px rgba(0,0,0,.55);

    transform:
        translate3d(0,80px,0)
        scale(.985);

    opacity: 0;

    transition:
        transform .55s cubic-bezier(.22,.8,.22,1),
        opacity .4s ease;

    will-change: transform, opacity;
}

.modal.open .sheet {

    transform:
        translate3d(0,0,0)
        scale(1);

    opacity: 1;
}

.modal.closing .sheet {

    transform:
        translate3d(0,80px,0)
        scale(.985);

    opacity: 0;
}


/* 손잡이 */

.handle {

    width: 38px;

    height: 5px;

    margin: 0 auto 21px;

    border-radius: 20px;

    background: #555;
}


/* =========================
   X
========================= */

.close {

    position: absolute;

    top: 18px;

    right: 18px;

    width: 32px;

    height: 32px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #303034;

    color: #aaa;

    font-size: 20px;

    line-height: 1;

    transition:
        left .18s ease,
        top .18s ease,
        transform .18s ease;
}

.close:hover {

    transform: scale(1.05);
}


/* =========================
   결제 정보
========================= */

.store {

    text-align: center;

    font-size: 17px;

    font-weight: 600;

    margin-bottom: 23px;
}

.product {

    text-align: center;

    padding-bottom: 21px;

    border-bottom:
        1px solid #38383a;
}

.product-name {

    font-size: 24px;

    font-weight: 700;

    letter-spacing: -.7px;
}

.sub {

    color: #98989d;

    font-size: 13px;

    margin-top: 7px;
}


/* 가격 */

.price {

    text-align: center;

    padding: 21px 0;

    font-size: 40px;

    font-weight: 700;

    letter-spacing: -1.5px;
}

.billing {

    display: block;

    margin-top: 5px;

    color: #98989d;

    font-size: 12px;

    font-weight: 400;
}


/* 정보 */

.info {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px 0;

    border-bottom:
        1px solid #38383a;
}

.label {

    color: #98989d;

    font-size: 13px;
}

.value {

    font-size: 12px;

    max-width: 65%;

    text-align: right;

    overflow: hidden;

    text-overflow: ellipsis;
}


/* 혜택 */

.benefits {

    padding: 15px 0;

    border-bottom:
        1px solid #38383a;
}

.benefit {

    margin: 8px 0;

    font-size: 13px;
}


/* 구매 */

.buy {

    width: 100%;

    height: 54px;

    margin-top: 19px;

    border-radius: 15px;

    background: #fff;

    color: #000;

    font-size: 16px;

    font-weight: 600;

    transition:
        transform .18s ease;
}

.buy:active {

    transform: scale(.97);
}


/* =========================
   인증
========================= */

.password-screen {

    display: none;

    text-align: center;

    padding: 17px 4px 4px;
}

.icon {

    font-size: 38px;

    margin-bottom: 15px;
}

.password-screen h2 {

    margin: 0 0 8px;

    font-size: 22px;
}

.password-screen p {

    margin: 0 0 20px;

    color: #98989d;

    font-size: 13px;

    line-height: 1.5;
}

.password {

    width: 100%;

    height: 50px;

    padding: 0 15px;

    border-radius: 13px;

    border:
        1px solid #444;

    background: #2c2c2e;

    color: #fff;

    outline: none;

    text-align: center;

    font-size: 16px;
}

.password:focus {

    border-color: #777;
}

.confirm {

    width: 100%;

    height: 52px;

    margin-top: 12px;

    border-radius: 14px;

    background: #fff;

    color: #000;

    font-weight: 600;
}


/* =========================
   로딩
========================= */

.loading {

    display: none;

    text-align: center;

    padding: 37px 4px;
}

.spinner {

    width: 35px;

    height: 35px;

    margin: 0 auto 20px;

    border-radius: 50%;

    border:
        3px solid #444;

    border-top-color: #fff;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {

    to {
        transform: rotate(360deg);
    }
}

.loading h2 {

    margin: 0 0 8px;

    font-size: 21px;
}

.loading p {

    margin: 0;

    color: #98989d;

    font-size: 13px;
}


/* =========================
   완료
========================= */

.success {

    display: none;

    text-align: center;

    padding: 30px 4px;
}

.check {

    width: 68px;

    height: 68px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    background: #fff;

    color: #000;

    font-size: 34px;
}

.success h2 {

    margin: 0 0 8px;

    font-size: 23px;
}

.success p {

    margin: 0;

    color: #98989d;

    font-size: 13px;

    line-height: 1.6;
}


/* =========================
   모바일
========================= */

@media(max-width:500px) {

    .sheet {

        padding: 21px;

        border-radius: 28px;
    }

    .price {

        font-size: 37px;
    }

    .close {

        top: 17px;

        right: 17px;
    }
}

</style>
</head>


<body>


<!-- =========================
     타이머
========================= -->

<div class="app">

    <div class="title">
        Timer
    </div>

    <div
        class="time"
        id="time"
    >
        00:03
    </div>


    <div class="controls">

        <button
            class="primary"
            onclick="startTimer()"
        >
            시작
        </button>

        <button
            class="secondary"
            onclick="pauseTimer()"
        >
            일시정지
        </button>

        <button
            class="secondary"
            onclick="resetTimer()"
        >
            초기화
        </button>

    </div>


    <!-- 결제 후에만 표시 -->

    <div
        class="settings"
        id="settings"
    >

        <div class="settings-title">
            타이머 시간 설정
        </div>

        <input
            class="time-input"
            id="timeInput"
            type="number"
            min="1"
            max="9999"
            value="3"
        >

        <button
            class="set"
            onclick="setTime()"
        >
            설정
        </button>

    </div>

</div>



<!-- =========================
     결제창
========================= -->

<div
    class="modal"
    id="modal"
>

    <div
        class="sheet"
        id="sheet"
    >

        <div class="handle"></div>


        <!-- X -->

        <button
            class="close"
            id="closeButton"
            onmouseenter="escapeClose()"
            onclick="cancelPayment()"
        >
            ×
        </button>


        <!-- 결제 정보 -->

        <div id="paymentInfo">

            <div class="store">
                App Store
            </div>


            <div class="product">

                <div class="product-name">
                    3초 타이머 프리미엄
                </div>

                <div class="sub">
                    앱 내 구입 · 일회성
                </div>

            </div>


            <div class="price">

                ₩100,000

                <span class="billing">
                    일회성 청구
                </span>

            </div>


            <div class="info">

                <div class="label">
                    구매 계정
                </div>

                <div class="value">
                    chunhe0208@icloud.com
                </div>

            </div>


            <div class="info">

                <div class="label">
                    결제 수단
                </div>

                <div class="value">
                    등록된 결제 수단
                </div>

            </div>


            <div class="benefits">

                <div class="benefit">
                    ✓ 3초 타이머 무제한 사용
                </div>

                <div class="benefit">
                    ✓ 광고 없음
                </div>

            </div>


            <button
                class="buy"
                onclick="showPassword()"
            >
                ₩100,000 구매
            </button>

        </div>



        <!-- =========================
             암호
        ========================= -->

        <div
            class="password-screen"
            id="passwordScreen"
        >

            <div class="icon">
                🔒
            </div>

            <h2>
                구매 인증
            </h2>

            <p>
                계속하려면 암호를 입력하세요.
            </p>

            <input
                class="password"
                id="password"
                type="password"
                autocomplete="off"
                placeholder="암호"
            >

            <button
                class="confirm"
                onclick="confirmPassword()"
            >
                계속
            </button>

        </div>



        <!-- =========================
             결제 처리
        ========================= -->

        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <h2>
                결제 처리 중
            </h2>

            <p>
                잠시만 기다려 주세요.
            </p>

        </div>



        <!-- =========================
             구매 완료
        ========================= -->

        <div
            class="success"
            id="success"
        >

            <div class="check">
                ✓
            </div>

            <h2>
                구매 완료
            </h2>

            <p>
                프리미엄 이용권이 활성화되었습니다.<br>
                이제 타이머를 무제한으로 사용할 수 있습니다.
            </p>

        </div>

    </div>

</div>



<!--
나중에 같은 폴더에
yarson.mp3
파일을 넣으면 아래를 사용할 수 있음.

<audio id="yarson" src="yarson.mp3"></audio>
-->



<script>

/* =========================
   상태
========================= */

let timer = null;

let lastTime = null;

let remaining = 3;

let defaultSeconds = 3;

let running = false;

let premium = false;


/* =========================
   시간 표시
========================= */

function updateDisplay(){

    const minutes =
        Math.floor(remaining / 60);

    const seconds =
        Math.floor(remaining % 60);


    document.getElementById("time").textContent =

        String(minutes).padStart(2,"0")

        + ":"

        + String(seconds).padStart(2,"0");
}


/* =========================
   타이머
========================= */

function tick(now){

    if(!running) return;


    if(lastTime === null){

        lastTime = now;
    }


    const elapsed =
        (now - lastTime) / 1000;


    if(elapsed >= 1){

        const passed =
            Math.floor(elapsed);


        remaining -= passed;

        lastTime += passed * 1000;


        if(remaining <= 0){

            remaining = 0;

            updateDisplay();

            running = false;

            lastTime = null;

            timer = null;


            /* 결제 전 */

            if(!premium){

                setTimeout(() => {

                    openPayment();

                },350);

                return;
            }


            /* 결제 후 */

            remaining =
                defaultSeconds;

            updateDisplay();

            return;
        }


        updateDisplay();
    }


    timer =
        requestAnimationFrame(tick);
}


/* =========================
   시작
========================= */

function startTimer(){

    if(running) return;


    running = true;

    lastTime = null;


    timer =
        requestAnimationFrame(tick);
}


/* =========================
   일시정지
========================= */

function pauseTimer(){

    if(!running) return;


    running = false;

    lastTime = null;


    if(timer !== null){

        cancelAnimationFrame(timer);

        timer = null;
    }
}


/* =========================
   초기화
========================= */

function resetTimer(){

    pauseTimer();


    remaining =
        defaultSeconds;


    updateDisplay();
}


/* =========================
   시간 설정
========================= */

function setTime(){

    /* 결제 전에는 사용 불가 */

    if(!premium) return;


    let value =
        Number(
            document
            .getElementById("timeInput")
            .value
        );


    if(!value || value < 1){

        return;
    }


    value =
        Math.min(value,9999);


    defaultSeconds =
        value;


    remaining =
        value;


    resetTimer();
}


/* =========================
   결제창 열기
========================= */

function openPayment(){

    const modal =
        document.getElementById("modal");


    modal.classList.remove("closing");


    /*
       두 프레임을 기다려서
       브라우저가 자연스럽게 애니메이션을
       시작하도록 함
    */

    requestAnimationFrame(() => {

        requestAnimationFrame(() => {

            modal.classList.add("open");

        });

    });
}


/* =========================
   X 도망
========================= */

function escapeClose(){

    const button =
        document.getElementById("closeButton");

    const sheet =
        document.getElementById("sheet");


    const width =
        sheet.clientWidth;

    const height =
        sheet.clientHeight;


    const x =
        Math.random() *
        Math.max(20,width - 65);


    const y =
        Math.random() *
        Math.max(20,height - 65);


    button.style.position =
        "absolute";

    button.style.left =
        x + "px";

    button.style.top =
        y + "px";
}


/* =========================
   결제 취소
========================= */

function cancelPayment(){

    /*
       나중에 yarson.mp3를 추가하면
       아래 부분을 사용할 수 있음.

       const sound =
           document.getElementById("yarson");

       sound.currentTime = 0;
       sound.play();
    */


    closePayment();
}


/* =========================
   결제창 닫기
========================= */

function closePayment(){

    const modal =
        document.getElementById("modal");


    modal.classList.remove("open");

    modal.classList.add("closing");


    setTimeout(() => {

        modal.classList.remove("closing");

        resetPayment();

    },550);
}


/* =========================
   결제 화면 초기화
========================= */

function resetPayment(){

    document.getElementById("paymentInfo")
        .style.display =
        "block";


    document.getElementById("passwordScreen")
        .style.display =
        "none";


    document.getElementById("loading")
        .style.display =
        "none";


    document.getElementById("success")
        .style.display =
        "none";


    document.getElementById("password")
        .value =
        "";


    const button =
        document.getElementById("closeButton");


    button.style.position =
        "";

    button.style.left =
        "";

    button.style.top =
        "";
}


/* =========================
   구매
========================= */

function showPassword(){

    document.getElementById("paymentInfo")
        .style.display =
        "none";


    document.getElementById("passwordScreen")
        .style.display =
        "block";


    setTimeout(() => {

        document.getElementById("password")
            .focus();

    },100);
}


/* =========================
   인증
========================= */

function confirmPassword(){

    const password =
        document.getElementById("password")
            .value;


    /*
       자체 인증.
       아무 문자열이나 입력하면 진행.
       입력값은 저장하거나 전송하지 않음.
    */

    if(password.length === 0){

        return;
    }


    document.getElementById("passwordScreen")
        .style.display =
        "none";


    document.getElementById("loading")
        .style.display =
        "block";


    /* 결제 처리 */

    setTimeout(() => {


        document.getElementById("loading")
            .style.display =
            "none";


        document.getElementById("success")
            .style.display =
            "block";


        premium =
            true;


        /* 결제 후 시간 설정 표시 */

        document.getElementById("settings")
            .classList.add("show");


        /*
           구매 완료 화면을
           3초 동안 표시
        */

        setTimeout(() => {

            closePayment();

        },3000);


    },2200);
}


/* =========================
   시작
========================= */

updateDisplay();

</script>

</body>
</html>
