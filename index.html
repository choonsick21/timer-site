<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        "Segoe UI",
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% -15%,
            #292929 0%,
            #0b0b0b 45%,
            #000000 100%
        );

    overflow: hidden;
}


/* =========================
   타이머
========================= */

.timer-card {
    width: min(92vw, 520px);
    padding: 48px 40px;

    text-align: center;

    background: rgba(35,35,35,.58);

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 38px;

    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);

    box-shadow:
        0 35px 100px rgba(0,0,0,.6),
        inset 0 1px 1px rgba(255,255,255,.08);

    animation: cardIn .6s ease;
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.timer-title {
    margin-bottom: 28px;

    font-size: 29px;
    font-weight: 700;

    letter-spacing: -1px;
}

#time {
    margin-bottom: 36px;

    font-size: clamp(70px, 17vw, 100px);
    font-weight: 700;

    letter-spacing: -6px;

    font-variant-numeric: tabular-nums;

    transition:
        transform .25s ease;
}

.timer-button {
    width: 220px;
    height: 62px;

    border: 0;
    border-radius: 20px;

    background: white;
    color: black;

    font-size: 18px;
    font-weight: 650;

    cursor: pointer;

    box-shadow:
        0 10px 30px rgba(255,255,255,.08);

    transition:
        transform .25s cubic-bezier(.2,.8,.2,1),
        box-shadow .25s ease;
}

.timer-button:hover {
    transform: scale(1.07);

    box-shadow:
        0 18px 40px rgba(255,255,255,.13);
}

.timer-button:active {
    transform: scale(.95);
}


/* =========================
   결제 배경
========================= */

.modal {
    position: fixed;
    inset: 0;

    display: none;
    align-items: flex-end;
    justify-content: center;

    background: rgba(0,0,0,.58);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    padding: 18px;

    z-index: 10;
}


/* =========================
   결제 시트
========================= */

.payment-sheet {
    width: min(100%, 470px);

    max-height: 94vh;
    overflow-y: auto;

    padding: 27px;

    background:
        linear-gradient(
            145deg,
            rgba(47,47,47,.98),
            rgba(18,18,18,.99)
        );

    border:
        1px solid rgba(255,255,255,.14);

    border-radius: 34px;

    box-shadow:
        0 -20px 90px rgba(0,0,0,.5),
        0 30px 100px rgba(0,0,0,.7),
        inset 0 1px 1px rgba(255,255,255,.08);

    animation:
        sheetUp .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes sheetUp {
    from {
        opacity: 0;
        transform: translateY(100px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* 위 손잡이 */

.handle {
    width: 42px;
    height: 5px;

    margin: 0 auto 25px;

    border-radius: 10px;

    background: rgba(255,255,255,.2);
}


/* 상단 */

.store-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 25px;
}

.store-name {
    font-size: 17px;
    font-weight: 700;
}

.demo-label {
    padding: 6px 9px;

    border-radius: 9px;

    background: rgba(255,255,255,.08);

    color: #aaa;

    font-size: 10px;
    font-weight: 600;
}


/* 상품 */

.product {
    padding-bottom: 22px;

    border-bottom:
        1px solid rgba(255,255,255,.09);
}

.product-name {
    font-size: 25px;
    font-weight: 700;

    letter-spacing: -.8px;
}

.product-description {
    margin-top: 7px;

    color: #999;

    font-size: 13px;
}


/* 가격 */

.price-area {
    padding: 22px 0 18px;
}

.price {
    font-size: 43px;
    font-weight: 750;

    letter-spacing: -2px;
}

.billing {
    margin-top: 5px;

    color: #888;

    font-size: 12px;
}


/* 계정 */

.account {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 17px;

    border-radius: 17px;

    background: rgba(255,255,255,.055);

    margin-bottom: 14px;
}

.account-label {
    color: #888;
    font-size: 12px;
}

.account-id {
    color: #ddd;
    font-size: 12px;
}


/* 결제 수단 */

.method-title {
    margin: 18px 0 9px;

    color: #888;

    font-size: 12px;
}

.method {
    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 15px 17px;

    border-radius: 17px;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.07);
}

.method-left {
    display: flex;
    align-items: center;
    gap: 11px;
}

.card-icon {
    width: 35px;
    height: 24px;

    border-radius: 6px;

    background:
        linear-gradient(
            145deg,
            #eeeeee,
            #777777
        );

    position: relative;
}

.card-icon::after {
    content: "";

    position: absolute;

    left: 5px;
    right: 5px;
    bottom: 5px;

    height: 3px;

    border-radius: 3px;

    background: #333;
}

.method-name {
    font-size: 13px;
}

.selected {
    width: 20px;
    height: 20px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;
    color: black;

    font-size: 12px;
}


/* 구매 버튼 */

.buy-button {
    width: 100%;
    height: 57px;

    margin-top: 22px;

    border: 0;
    border-radius: 18px;

    background: white;
    color: black;

    font-size: 17px;
    font-weight: 700;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.buy-button:hover {
    transform: scale(1.025);

    box-shadow:
        0 12px 35px rgba(255,255,255,.12);
}

.buy-button:active {
    transform: scale(.97);
}


/* =========================
   인증 화면
========================= */

.auth-screen {
    display: none;

    text-align: center;

    padding: 35px 10px 20px;
}

.face-circle {
    width: 82px;
    height: 82px;

    margin: 0 auto 24px;

    display: flex;
    align-items: center;
    justify-content: center;

    border:
        2px solid rgba(255,255,255,.85);

    border-radius: 50%;

    font-size: 34px;

    animation:
        facePulse 1.5s infinite;
}

@keyframes facePulse {
    0%, 100% {
        box-shadow:
            0 0 0 rgba(255,255,255,0);
    }

    50% {
        box-shadow:
            0 0 35px rgba(255,255,255,.16);
    }
}

.auth-screen h2 {
    margin: 0 0 8px;

    font-size: 23px;
}

.auth-screen p {
    margin: 0;

    color: #888;

    font-size: 13px;
}


/* =========================
   결제 중
========================= */

.loading-screen {
    display: none;

    text-align: center;

    padding: 45px 10px;
}

.spinner {
    width: 50px;
    height: 50px;

    margin: 0 auto 23px;

    border-radius: 50%;

    border: 4px solid #3d3d3d;
    border-top-color: white;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading-screen h2 {
    margin: 0 0 8px;

    font-size: 22px;
}

.loading-screen p {
    margin: 0;

    color: #888;

    font-size: 13px;
}


/* =========================
   결제 완료
========================= */

.success-screen {
    display: none;

    text-align: center;

    padding: 35px 10px 30px;

    animation:
        successIn .5s cubic-bezier(.2,1.3,.4,1);
}

@keyframes successIn {
    from {
        opacity: 0;
        transform: scale(.85);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.success-icon {
    width: 72px;
    height: 72px;

    margin: 0 auto 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: white;
    color: black;

    font-size: 36px;

    animation:
        checkPop .5s cubic-bezier(.2,1.5,.4,1);
}

@keyframes checkPop {
    from {
        transform: scale(0);
    }

    to {
        transform: scale(1);
    }
}

.success-screen h2 {
    margin: 0 0 10px;

    font-size: 25px;
}

.success-screen p {
    margin: 0;

    color: #888;

    font-size: 13px;
    line-height: 1.7;
}


/* =========================
   모바일
========================= */

@media(max-width:500px) {

    .timer-card {
        padding: 38px 20px;
        border-radius: 30px;
    }

    .payment-sheet {
        padding: 23px;
        border-radius: 30px;
    }

    .price {
        font-size: 38px;
    }
}
</style>
</head>


<body>


<!-- =========================
     타이머
========================= -->

<div class="timer-card">

    <div class="timer-title">
        Timer
    </div>

    <div id="time">
        00:03
    </div>

    <button
        class="timer-button"
        onclick="startTimer()"
    >
        3초 카운트
    </button>

</div>



<!-- =========================
     결제창
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="payment-sheet">

        <div class="handle"></div>


        <!-- 결제 정보 -->

        <div id="paymentInfo">

            <div class="store-header">

                <div class="store-name">
                    App Store
                </div>

                <div class="demo-label">
                    모의 결제
                </div>

            </div>


            <div class="product">

                <div class="product-name">
                    3초 타이머 프리미엄
                </div>

                <div class="product-description">
                    앱 내 구입 · 일회성
                </div>

            </div>


            <div class="price-area">

                <div class="price">
                    ₩100,000
                </div>

                <div class="billing">
                    일회성 청구
                </div>

            </div>


            <!-- 구매 계정 -->

            <div class="account">

                <div class="account-label">
                    구매 계정
                </div>

                <div class="account-id">
                    user@example.com
                </div>

            </div>


            <!-- 결제 수단 -->

            <div class="method-title">
                결제 수단
            </div>

            <div class="method">

                <div class="method-left">

                    <div class="card-icon"></div>

                    <div class="method-name">
                        등록된 결제 수단
                    </div>

                </div>

                <div class="selected">
                    ✓
                </div>

            </div>


            <button
                class="buy-button"
                onclick="authenticate()"
            >
                ₩100,000 구매
            </button>

        </div>



        <!-- =========================
             인증
        ========================= -->

        <div
            class="auth-screen"
            id="auth"
        >

            <div class="face-circle">
                ◉
            </div>

            <h2>
                인증 중
            </h2>

            <p>
                본인 확인을 진행하고 있습니다
            </p>

        </div>



        <!-- =========================
             결제 중
        ========================= -->

        <div
            class="loading-screen"
            id="loading"
        >

            <div class="spinner"></div>

            <h2>
                결제 처리 중
            </h2>

            <p>
                잠시만 기다려 주세요
            </p>

        </div>



        <!-- =========================
             완료
        ========================= -->

        <div
            class="success-screen"
            id="success"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                구매 완료
            </h2>

            <p>
                프리미엄 이용권이 활성화되었습니다.<br>
                3초 타이머를 무제한으로 사용할 수 있습니다.
            </p>

        </div>

    </div>

</div>



<script>

let timer = null;
let premium = false;


/* =========================
   효과음
========================= */

function playSound(type) {

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioContext) return;

    const audio =
        new AudioContext();

    const oscillator =
        audio.createOscillator();

    const gain =
        audio.createGain();

    oscillator.connect(gain);
    gain.connect(audio.destination);


    if (type === "tick") {

        oscillator.frequency.value = 620;

        gain.gain.setValueAtTime(
            0.08,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + .12
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + .12
        );
    }


    if (type === "success") {

        oscillator.frequency.setValueAtTime(
            520,
            audio.currentTime
        );

        oscillator.frequency.exponentialRampToValueAtTime(
            780,
            audio.currentTime + .25
        );

        gain.gain.setValueAtTime(
            0.1,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + .4
        );

        oscillator.start();

        oscillator.stop(
            audio.currentTime + .4
        );
    }
}


/* =========================
   타이머
========================= */

function startTimer() {

    if (timer !== null) {
        return;
    }

    let count = 3;

    document.getElementById("time").textContent =
        "00:0" + count;

    playSound("tick");


    timer = setInterval(() => {

        count--;

        if (count > 0) {

            document.getElementById("time").textContent =
                "00:0" + count;

            playSound("tick");

        } else {

            clearInterval(timer);
            timer = null;

            document.getElementById("time").textContent =
                "00:00";


            setTimeout(() => {

                if (premium) {

                    startTimer();

                } else {

                    openPayment();

                }

            }, 400);
        }

    }, 1000);
}


/* =========================
   결제창 열기
========================= */

function openPayment() {

    document.getElementById("modal").style.display =
        "flex";
}


/* =========================
   인증
========================= */

function authenticate() {

    document.getElementById("paymentInfo").style.display =
        "none";

    document.getElementById("auth").style.display =
        "block";


    /* 가짜 인증 */

    setTimeout(() => {

        document.getElementById("auth").style.display =
            "none";

        document.getElementById("loading").style.display =
            "block";


        /* 결제 처리 */

        setTimeout(() => {

            document.getElementById("loading").style.display =
                "none";

            document.getElementById("success").style.display =
                "block";

            premium = true;

            playSound("success");


            /* 완료 화면 3초 */

            setTimeout(() => {

                document.getElementById("modal").style.display =
                    "none";

                document.getElementById("success").style.display =
                    "none";

                document.getElementById("paymentInfo").style.display =
                    "block";

            }, 3000);

        }, 2200);

    }, 1800);
}

</script>

</body>
</html>
