<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#000;
    color:#fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
}

button,
input{
    font-family:inherit;
}


/* =========================
   메인 타이머
========================= */

.app{
    width:min(90vw,520px);
    text-align:center;
}

.title{
    font-size:30px;
    font-weight:700;
    letter-spacing:-1px;
    margin-bottom:32px;
}

.time{
    font-size:clamp(78px,18vw,108px);
    line-height:1;
    font-weight:700;
    letter-spacing:-6px;
    font-variant-numeric:tabular-nums;
    margin-bottom:32px;
}

.controls{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}

button{
    border:0;
    cursor:pointer;
}

.primary{
    padding:15px 30px;
    border-radius:17px;
    background:#fff;
    color:#000;
    font-size:16px;
    font-weight:600;
    transition:transform .15s ease;
}

.primary:active{
    transform:scale(.96);
}

.secondary{
    padding:15px 20px;
    border-radius:17px;
    background:#1c1c1e;
    color:#fff;
    border:1px solid #303034;
    font-size:15px;
    transition:
        transform .15s ease,
        background .15s ease;
}

.secondary:hover{
    background:#29292b;
}

.secondary:active{
    transform:scale(.96);
}


/* =========================
   프리미엄 설정
========================= */

.settings{
    margin-top:25px;
    padding:17px;
    border-radius:20px;
    background:#111;
    border:1px solid #252525;

    opacity:0;
    transform:translateY(8px);
    pointer-events:none;

    transition:
        opacity .35s ease,
        transform .35s ease;
}

.settings.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.settings-title{
    color:#999;
    font-size:12px;
    margin-bottom:10px;
}

.time-input{
    width:110px;
    height:44px;
    border-radius:12px;
    border:1px solid #3a3a3c;
    background:#1c1c1e;
    color:#fff;
    outline:none;
    text-align:center;
    font-size:16px;
}

.set{
    height:44px;
    margin-left:5px;
    padding:0 18px;
    border-radius:12px;
    background:#fff;
    color:#000;
    font-weight:600;
}


/* =========================
   결제 배경
========================= */

.modal{
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:flex-end;

    padding:12px;

    background:rgba(0,0,0,.68);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    opacity:0;
    visibility:hidden;
    pointer-events:none;

    transition:
        opacity .45s cubic-bezier(.22,1,.36,1);

    z-index:100;
}

.modal.open{
    opacity:1;
    visibility:visible;
    pointer-events:auto;
}


/* =========================
   결제창
========================= */

.sheet{
    position:relative;

    width:min(100%,450px);

    /*
       실제 높이는 자바스크립트가
       화면 내용에 맞춰 변경
    */
    height:100px;

    overflow:hidden;

    padding:23px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(45,45,47,.98),
            rgba(24,24,26,.98)
        );

    border:1px solid rgba(255,255,255,.11);

    box-shadow:
        0 -20px 70px rgba(0,0,0,.55);

    transform:
        translate3d(0,45px,0)
        scale(.985);

    opacity:0;

    transition:
        height .62s cubic-bezier(.22,1,.36,1),
        transform .62s cubic-bezier(.22,1,.36,1),
        opacity .42s ease;

    will-change:height,transform,opacity;
}

.modal.open .sheet{
    transform:
        translate3d(0,0,0)
        scale(1);

    opacity:1;
}

.modal.closing{
    opacity:0;
}

.modal.closing .sheet{
    transform:
        translate3d(0,30px,0)
        scale(.985);

    opacity:0;
}


/* =========================
   내부
========================= */

.sheet-content{
    position:relative;
    width:100%;
}

.page{
    width:100%;

    transition:
        opacity .4s cubic-bezier(.22,1,.36,1),
        transform .55s cubic-bezier(.22,1,.36,1);
}

.page.visible{
    opacity:1;
    transform:
        translate3d(0,0,0)
        scale(1);
}

.page.leaving{
    opacity:0;
    transform:
        translate3d(0,18px,0)
        scale(.97);
}

.page.entering{
    opacity:0;
    transform:
        translate3d(0,18px,0)
        scale(.97);
}


/* =========================
   손잡이
========================= */

.handle{
    width:38px;
    height:5px;
    margin:0 auto 21px;
    border-radius:20px;
    background:#555;
}


/* =========================
   X
========================= */

.close{
    position:absolute;

    top:18px;
    right:18px;

    width:32px;
    height:32px;

    border-radius:50%;

    background:#303034;
    color:#aaa;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:20px;

    transition:
        left .18s ease,
        top .18s ease,
        transform .15s ease;
}


/* =========================
   결제 화면
========================= */

.store{
    text-align:center;
    font-size:17px;
    font-weight:600;
    margin-bottom:23px;
}

.product{
    text-align:center;
    padding-bottom:21px;
    border-bottom:1px solid #38383a;
}

.product-name{
    font-size:24px;
    font-weight:700;
    letter-spacing:-.7px;
}

.sub{
    color:#98989d;
    font-size:13px;
    margin-top:7px;
}

.price{
    text-align:center;
    padding:21px 0;
    font-size:40px;
    font-weight:700;
    letter-spacing:-1.5px;
}

.billing{
    display:block;
    color:#98989d;
    font-size:12px;
    font-weight:400;
    margin-top:5px;
}

.info{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px 0;

    border-bottom:1px solid #38383a;
}

.label{
    color:#98989d;
    font-size:13px;
}

.value{
    font-size:12px;
    text-align:right;
    max-width:65%;
    overflow:hidden;
    text-overflow:ellipsis;
}

.benefits{
    padding:15px 0;
    border-bottom:1px solid #38383a;
}

.benefit{
    margin:8px 0;
    font-size:13px;
}


/* =========================
   구매 버튼
========================= */

.buy{
    width:100%;
    height:54px;

    margin-top:19px;

    border-radius:15px;

    background:#fff;
    color:#000;

    font-size:16px;
    font-weight:600;

    transition:
        transform .15s ease;
}

.buy:active{
    transform:scale(.97);
}


/* =========================
   인증
========================= */

.password-page{
    text-align:center;
    padding:20px 4px 5px;
}

.lock{
    width:58px;
    height:58px;

    margin:0 auto 18px;

    border-radius:50%;

    background:#303034;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
}

.password-page h2{
    margin:0 0 8px;
    font-size:22px;
}

.password-page p{
    margin:0 0 22px;
    color:#98989d;
    font-size:13px;
}

.password{
    width:100%;
    height:51px;

    border-radius:13px;

    border:1px solid #444;

    background:#2c2c2e;
    color:#fff;

    outline:none;

    text-align:center;
    font-size:16px;
}

.confirm{
    width:100%;
    height:52px;

    margin-top:12px;

    border-radius:14px;

    background:#fff;
    color:#000;

    font-weight:600;
}


/* =========================
   로딩
========================= */

.loading-page{
    text-align:center;
    padding:40px 4px;
}

.spinner{
    width:36px;
    height:36px;

    margin:0 auto 20px;

    border-radius:50%;

    border:3px solid #444;
    border-top-color:#fff;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loading-page h2{
    margin:0 0 8px;
    font-size:21px;
}

.loading-page p{
    margin:0;
    color:#98989d;
    font-size:13px;
}


/* =========================
   완료
========================= */

.success-page{
    text-align:center;
    padding:30px 4px;
}

.check{
    width:68px;
    height:68px;

    margin:0 auto 20px;

    border-radius:50%;

    background:#fff;
    color:#000;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
}

.success-page h2{
    margin:0 0 8px;
    font-size:23px;
}

.success-page p{
    margin:0;
    color:#98989d;
    font-size:13px;
    line-height:1.6;
}


/* =========================
   휴대폰
========================= */

@media(max-width:500px){

    .sheet{
        padding:21px;
        border-radius:28px;
    }

    .price{
        font-size:37px;
    }
}

</style>
</head>


<body>


<!-- =========================
     타이머
========================= -->

<div class="app">

    <div class="title">
        Timer
    </div>

    <div
        class="time"
        id="time"
    >
        00:03
    </div>

    <div class="controls">

        <button
            class="primary"
            onclick="startTimer()"
        >
            시작
        </button>

        <button
            class="secondary"
            onclick="pauseTimer()"
        >
            일시정지
        </button>

        <button
            class="secondary"
            onclick="resetTimer()"
        >
            초기화
        </button>

    </div>


    <!-- 구매 완료 후 사용 가능 -->

    <div
        class="settings"
        id="settings"
    >

        <div class="settings-title">
            타이머 시간 설정
        </div>

        <input
            class="time-input"
            id="timeInput"
            type="number"
            min="1"
            max="9999"
            value="3"
        >

        <button
            class="set"
            onclick="setTime()"
        >
            설정
        </button>

    </div>

</div>



<!-- =========================
     결제 창
========================= -->

<div
    class="modal"
    id="modal"
>

    <div
        class="sheet"
        id="sheet"
    >

        <div class="handle"></div>


        <button
            class="close"
            id="closeButton"
            onmouseenter="escapeClose()"
            onclick="closePayment()"
            aria-label="닫기"
        >
            ×
        </button>


        <div
            class="sheet-content"
            id="sheetContent"
        >


            <!-- =====================
                 결제
            ====================== -->

            <div
                class="page visible"
                id="paymentPage"
            >

                <div class="store">
                    App Store
                </div>


                <div class="product">

                    <div class="product-name">
                        3초 타이머 프리미엄
                    </div>

                    <div class="sub">
                        앱 내 구입 · 일회성
                    </div>

                </div>


                <div class="price">

                    ₩100,000

                    <span class="billing">
                        일회성 청구
                    </span>

                </div>


                <div class="info">

                    <div class="label">
                        구매 계정
                    </div>

                    <div class="value">
                        chunhe0208@icloud.com
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        결제 수단
                    </div>

                    <div class="value">
                        등록된 결제 수단
                    </div>

                </div>


                <div class="benefits">

                    <div class="benefit">
                        ✓ 3초 타이머 무제한 사용
                    </div>

                    <div class="benefit">
                        ✓ 광고 없음
                    </div>

                </div>


                <button
                    class="buy"
                    onclick="showPassword()"
                >
                    ₩100,000 구매
                </button>

            </div>



            <!-- =====================
                 인증
            ====================== -->

            <div
                class="page entering"
                id="passwordPage"
                style="display:none"
            >

                <div class="password-page">

                    <div class="lock">
                        🔒
                    </div>

                    <h2>
                        구매 인증
                    </h2>

                    <p>
                        계속하려면 암호를 입력하세요.
                    </p>

                    <input
                        class="password"
                        id="password"
                        type="password"
                        placeholder="암호"
                        autocomplete="off"
                    >

                    <button
                        class="confirm"
                        onclick="confirmPassword()"
                    >
                        계속
                    </button>

                </div>

            </div>



            <!-- =====================
                 결제 처리
            ====================== -->

            <div
                class="page entering"
                id="loadingPage"
                style="display:none"
            >

                <div class="loading-page">

                    <div class="spinner"></div>

                    <h2>
                        결제 처리 중
                    </h2>

                    <p>
                        잠시만 기다려 주세요.
                    </p>

                </div>

            </div>



            <!-- =====================
                 완료
            ====================== -->

            <div
                class="page entering"
                id="successPage"
                style="display:none"
            >

                <div class="success-page">

                    <div class="check">
                        ✓
                    </div>

                    <h2>
                        구매 완료
                    </h2>

                    <p>
                        프리미엄 이용권이 활성화되었습니다.<br>
                        이제 타이머를 자유롭게 사용할 수 있습니다.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>



<script>

/* ========================================
   변수
======================================== */

let running = false;
let timer = null;

let remaining = 3;
let defaultSeconds = 3;

let endTime = 0;

let premium = false;


/* ========================================
   시간 표시
======================================== */

function updateDisplay(){

    const minutes =
        Math.floor(remaining / 60);

    const seconds =
        Math.floor(remaining % 60);

    document.getElementById("time")
        .textContent =
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");
}


/* ========================================
   타이머
======================================== */

function tick(){

    if(!running){
        return;
    }

    remaining =
        Math.max(
            0,
            Math.ceil(
                (
                    endTime -
                    performance.now()
                ) / 1000
            )
        );

    updateDisplay();

    if(remaining <= 0){

        running = false;
        timer = null;

        if(!premium){

            setTimeout(
                openPayment,
                250
            );

            return;
        }

        remaining =
            defaultSeconds;

        updateDisplay();

        return;
    }

    timer =
        requestAnimationFrame(tick);
}


/* ========================================
   시작
======================================== */

function startTimer(){

    if(running){
        return;
    }

    if(remaining <= 0){
        remaining = defaultSeconds;
    }

    running = true;

    endTime =
        performance.now()
        +
        remaining * 1000;

    tick();
}


/* ========================================
   일시정지
======================================== */

function pauseTimer(){

    if(!running){
        return;
    }

    remaining =
        Math.max(
            0,
            Math.ceil(
                (
                    endTime -
                    performance.now()
                ) / 1000
            )
        );

    running = false;

    if(timer){
        cancelAnimationFrame(timer);
        timer = null;
    }

    updateDisplay();
}


/* ========================================
   초기화
======================================== */

function resetTimer(){

    pauseTimer();

    remaining =
        defaultSeconds;

    updateDisplay();
}


/* ========================================
   시간 설정
======================================== */

function setTime(){

    if(!premium){
        return;
    }

    let value =
        Number(
            document
            .getElementById("timeInput")
            .value
        );

    if(!value || value < 1){
        return;
    }

    value =
        Math.min(value,9999);

    defaultSeconds =
        value;

    resetTimer();
}


/* ========================================
   결제창 열기
======================================== */

function openPayment(){

    const modal =
        document.getElementById("modal");

    const sheet =
        document.getElementById("sheet");

    const payment =
        document.getElementById("paymentPage");

    resizeSheet(payment);

    modal.style.visibility = "visible";

    requestAnimationFrame(() => {

        modal.classList.add("open");

    });
}


/* ========================================
   결제창 높이 계산

   이 부분이 핵심.
   현재 화면 내용에 맞춰서
   바깥 창 높이를 바꿈.
======================================== */

function resizeSheet(page){

    const sheet =
        document.getElementById("sheet");

    const previousDisplay =
        page.style.display;

    const previousPosition =
        page.style.position;

    const previousVisibility =
        page.style.visibility;

    page.style.display = "block";
    page.style.position = "absolute";
    page.style.visibility = "hidden";

    const pageHeight =
        page.offsetHeight;

    page.style.position =
        previousPosition;

    page.style.visibility =
        previousVisibility;

    if(previousDisplay){
        page.style.display =
            previousDisplay;
    }

    /*
       상단 손잡이 + 위아래 여백
    */

    const totalHeight =
        pageHeight + 72;

    sheet.style.height =
        totalHeight + "px";
}


/* ========================================
   페이지 전환
======================================== */

function changePage(from,to){

    /*
       다음 페이지를 먼저 표시해서
       높이를 정확하게 측정
    */

    to.style.display = "block";

    to.classList.remove(
        "visible",
        "leaving"
    );

    to.classList.add("entering");

    /*
       다음 화면 크기로
       바깥 창을 부드럽게 변경
    */

    resizeSheet(to);


    /*
       현재 화면 퇴장
    */

    from.classList.remove("visible");
    from.classList.add("leaving");


    setTimeout(() => {

        from.style.display = "none";
        from.classList.remove("leaving");

        requestAnimationFrame(() => {

            to.classList.remove("entering");
            to.classList.add("visible");

        });

    },400);
}


/* ========================================
   구매 버튼
======================================== */

function showPassword(){

    const payment =
        document.getElementById(
            "paymentPage"
        );

    const password =
        document.getElementById(
            "passwordPage"
        );

    changePage(
        payment,
        password
    );

    setTimeout(() => {

        document
            .getElementById("password")
            .focus();

    },800);
}


/* ========================================
   인증
======================================== */

function confirmPassword(){

    const password =
        document
        .getElementById("password")
        .value;

    /*
       화면 연출용이므로
       아무 문자나 입력하면 진행
    */

    if(password.length === 0){
        return;
    }


    const passwordPage =
        document.getElementById(
            "passwordPage"
        );

    const loadingPage =
        document.getElementById(
            "loadingPage"
        );

    changePage(
        passwordPage,
        loadingPage
    );


    /*
       결제 처리 연출
    */

    setTimeout(() => {

        const loading =
            document.getElementById(
                "loadingPage"
            );

        const success =
            document.getElementById(
                "successPage"
            );

        changePage(
            loading,
            success
        );


        premium = true;


        document
            .getElementById("settings")
            .classList.add("show");


        /*
           완료 화면을
           잠시 보여줌
        */

        setTimeout(() => {

            closePayment();

        },3500);

    },2200);
}


/* ========================================
   결제창 닫기
======================================== */

function closePayment(){

    const modal =
        document.getElementById("modal");

    modal.classList.remove("open");
    modal.classList.add("closing");

    setTimeout(() => {

        modal.classList.remove("closing");

        modal.style.visibility =
            "hidden";

        resetPages();

    },650);
}


/* ========================================
   화면 초기화
======================================== */

function resetPages(){

    const pages = [

        document.getElementById(
            "paymentPage"
        ),

        document.getElementById(
            "passwordPage"
        ),

        document.getElementById(
            "loadingPage"
        ),

        document.getElementById(
            "successPage"
        )

    ];


    pages.forEach(page => {

        page.style.display = "none";

        page.classList.remove(
            "visible",
            "leaving",
            "entering"
        );

    });


    const payment =
        document.getElementById(
            "paymentPage"
        );

    payment.style.display = "block";

    payment.classList.add("visible");


    document.getElementById(
        "password"
    ).value = "";


    /*
       X 버튼 위치 초기화
    */

    const close =
        document.getElementById(
            "closeButton"
        );

    close.style.position = "";
    close.style.left = "";
    close.style.top = "";


    setTimeout(() => {

        resizeSheet(payment);

    },20);
}


/* ========================================
   X 버튼 살짝 도망가기

   너무 멀리 안 감.
   약 15~20px만 이동.
======================================== */

function escapeClose(){

    const button =
        document.getElementById(
            "closeButton"
        );

    const sheet =
        document.getElementById(
            "sheet"
        );


    const currentLeft =
        button.offsetLeft;

    const currentTop =
        button.offsetTop;


    const moveX =
        Math.random() > .5
        ? 18
        : -18;

    const moveY =
        Math.random() > .5
        ? 12
        : -12;


    let newX =
        currentLeft + moveX;

    let newY =
        currentTop + moveY;


    /*
       결제창 밖으로 나가지 않게
    */

    newX =
        Math.max(
            8,
            Math.min(
                newX,
                sheet.clientWidth -
                button.offsetWidth -
                8
            )
        );


    newY =
        Math.max(
            8,
            Math.min(
                newY,
                sheet.clientHeight -
                button.offsetHeight -
                8
            )
        );


    button.style.position =
        "absolute";

    button.style.left =
        newX + "px";

    button.style.top =
        newY + "px";
}


/* ========================================
   엔터키로 인증
======================================== */

document
.getElementById("password")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            confirmPassword();
        }

    }
);


/* ========================================
   시작
======================================== */

updateDisplay();

</script>
