<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timer</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    background:#000;
    color:#fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        sans-serif;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    -webkit-font-smoothing:antialiased;
}


/* =========================
   메인
========================= */

.app{
    width:min(90vw,520px);
    text-align:center;
}

.title{
    font-size:30px;
    font-weight:700;

    letter-spacing:-1px;

    margin-bottom:30px;
}

.time{
    font-size:clamp(78px,18vw,108px);

    line-height:1;

    font-weight:700;

    letter-spacing:-6px;

    font-variant-numeric:tabular-nums;

    margin-bottom:32px;
}

.controls{
    display:flex;
    justify-content:center;

    gap:9px;

    flex-wrap:wrap;
}

button{
    font-family:inherit;
    border:0;
    cursor:pointer;
}

.primary{
    padding:15px 30px;

    border-radius:17px;

    background:#fff;
    color:#000;

    font-size:16px;
    font-weight:600;

    transition:
        transform .12s ease;
}

.primary:active{
    transform:scale(.95);
}

.secondary{
    padding:15px 20px;

    border-radius:17px;

    background:#1c1c1e;
    color:#fff;

    border:1px solid #303034;

    font-size:15px;

    transition:
        transform .12s ease,
        background .15s ease;
}

.secondary:hover{
    background:#29292b;
}

.secondary:active{
    transform:scale(.95);
}


/* =========================
   설정
========================= */

.settings{
    margin-top:25px;

    padding:17px;

    border-radius:20px;

    background:#111;

    border:1px solid #252525;

    opacity:0;

    transform:translateY(8px);

    pointer-events:none;

    transition:
        opacity .3s ease,
        transform .3s ease;
}

.settings.show{
    opacity:1;

    transform:translateY(0);

    pointer-events:auto;
}

.settings-title{
    color:#999;

    font-size:12px;

    margin-bottom:10px;
}

.time-input{
    width:110px;
    height:44px;

    border-radius:12px;

    border:1px solid #3a3a3c;

    background:#1c1c1e;
    color:#fff;

    outline:none;

    text-align:center;

    font-size:16px;
}

.set{
    height:44px;

    margin-left:5px;

    padding:0 18px;

    border-radius:12px;

    background:#fff;
    color:#000;

    font-weight:600;
}


/* =========================
   모달
========================= */

.modal{
    position:fixed;

    inset:0;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    padding:12px;

    background:rgba(0,0,0,.72);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    opacity:0;

    visibility:hidden;

    pointer-events:none;

    transition:
        opacity .35s ease;

    z-index:100;
}

.modal.open{
    opacity:1;

    visibility:visible;

    pointer-events:auto;
}

.modal.closing{
    opacity:0;
}


/* =========================
   결제창
========================= */

.sheet{
    position:relative;

    width:min(100%,450px);

    height:100px;

    overflow:hidden;

    padding:23px;

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(45,45,47,.99),
            rgba(24,24,26,.99)
        );

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
        0 -20px 70px rgba(0,0,0,.65);

    transform:
        translate3d(0,55px,0)
        scale(.98);

    opacity:0;

    transition:
        height .48s cubic-bezier(.22,1,.36,1),
        transform .48s cubic-bezier(.22,1,.36,1),
        opacity .28s ease;

    will-change:
        height,
        transform,
        opacity;
}

.modal.open .sheet{
    transform:
        translate3d(0,0,0)
        scale(1);

    opacity:1;
}

.modal.closing .sheet{
    transform:
        translate3d(0,35px,0)
        scale(.98);

    opacity:0;
}


/* =========================
   손잡이
========================= */

.handle{
    width:38px;
    height:5px;

    margin:0 auto 20px;

    border-radius:50px;

    background:#555;
}


/* =========================
   X 버튼
========================= */

.close{
    position:absolute;

    top:18px;
    right:18px;

    width:32px;
    height:32px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#303034;

    color:#aaa;

    font-size:20px;

    /*
       클릭 / 터치 완전 차단
    */
    pointer-events:none;

    user-select:none;

    /*
       빠른 회피
    */
    transition:
        left .07s linear,
        top .07s linear;

    z-index:50;
}


/* =========================
   페이지
========================= */

.page{
    width:100%;

    transition:
        opacity .25s ease,
        transform .32s cubic-bezier(.22,1,.36,1);
}

.page.visible{
    opacity:1;

    transform:
        translate3d(0,0,0)
        scale(1);
}

.page.entering{
    opacity:0;

    transform:
        translate3d(0,15px,0)
        scale(.98);
}

.page.leaving{
    opacity:0;

    transform:
        translate3d(0,-10px,0)
        scale(.98);
}


/* =========================
   상품
========================= */

.store{
    text-align:center;

    font-size:17px;

    font-weight:600;

    margin-bottom:22px;
}

.product{
    text-align:center;

    padding-bottom:20px;

    border-bottom:
        1px solid #38383a;
}

.product-name{
    font-size:24px;

    font-weight:700;

    letter-spacing:-.7px;
}

.sub{
    color:#98989d;

    font-size:13px;

    margin-top:7px;
}

.price{
    text-align:center;

    padding:20px 0;

    font-size:40px;

    font-weight:700;

    letter-spacing:-1.5px;
}

.billing{
    display:block;

    margin-top:5px;

    color:#98989d;

    font-size:12px;

    font-weight:400;
}


/* =========================
   정보
========================= */

.info{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:14px 0;

    border-bottom:
        1px solid #38383a;
}

.label{
    color:#98989d;

    font-size:13px;
}

.value{
    max-width:65%;

    overflow:hidden;

    text-overflow:ellipsis;

    font-size:12px;

    text-align:right;
}


/* =========================
   혜택
========================= */

.benefits{
    padding:14px 0;

    border-bottom:
        1px solid #38383a;
}

.benefit{
    margin:8px 0;

    font-size:13px;
}


/* =========================
   구매
========================= */

.buy{
    width:100%;
    height:54px;

    margin-top:18px;

    border-radius:15px;

    background:#fff;
    color:#000;

    font-size:16px;

    font-weight:600;

    transition:
        transform .12s ease;
}

.buy:active{
    transform:scale(.96);
}


/* =========================
   인증
========================= */

.password-page{
    text-align:center;

    padding:20px 4px 5px;
}

.lock{
    width:58px;
    height:58px;

    margin:0 auto 18px;

    border-radius:50%;

    background:#303034;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;
}

.password-page h2{
    margin:0 0 8px;

    font-size:22px;
}

.password-page p{
    margin:0 0 22px;

    color:#98989d;

    font-size:13px;
}

.password{
    width:100%;
    height:51px;

    border-radius:13px;

    border:1px solid #444;

    background:#2c2c2e;
    color:#fff;

    outline:none;

    text-align:center;

    font-size:16px;
}

.confirm{
    width:100%;
    height:52px;

    margin-top:12px;

    border-radius:14px;

    background:#fff;
    color:#000;

    font-weight:600;
}


/* =========================
   로딩
========================= */

.loading-page{
    text-align:center;

    padding:40px 4px;
}

.spinner{
    width:36px;
    height:36px;

    margin:0 auto 20px;

    border-radius:50%;

    border:3px solid #444;

    border-top-color:#fff;

    animation:
        spin .7s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}

.loading-page h2{
    margin:0 0 8px;

    font-size:21px;
}

.loading-page p{
    margin:0;

    color:#98989d;

    font-size:13px;
}


/* =========================
   완료
========================= */

.success-page{
    text-align:center;

    padding:30px 4px;
}

.check{
    width:68px;
    height:68px;

    margin:0 auto 20px;

    border-radius:50%;

    background:#fff;

    color:#000;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:34px;
}

.success-page h2{
    margin:0 0 8px;

    font-size:23px;
}

.success-page p{
    margin:0;

    color:#98989d;

    font-size:13px;

    line-height:1.6;
}


/* =========================
   모바일
========================= */

@media(max-width:500px){

    .sheet{
        padding:21px;

        border-radius:28px;
    }

    .price{
        font-size:37px;
    }

}

</style>
</head>


<body>


<!-- =========================
     메인
========================= -->

<div class="app">

    <div class="title">
        Timer
    </div>

    <div
        class="time"
        id="time"
    >
        00:03
    </div>


    <div class="controls">

        <button
            class="primary"
            onclick="startTimer()"
        >
            시작
        </button>

        <button
            class="secondary"
            onclick="pauseTimer()"
        >
            일시정지
        </button>

        <button
            class="secondary"
            onclick="resetTimer()"
        >
            초기화
        </button>

    </div>


    <div
        class="settings"
        id="settings"
    >

        <div class="settings-title">
            타이머 시간 설정
        </div>

        <input
            class="time-input"
            id="timeInput"
            type="number"
            min="1"
            max="9999"
            value="3"
        >

        <button
            class="set"
            onclick="setTime()"
        >
            설정
        </button>

    </div>

</div>



<!-- =========================
     결제창
========================= -->

<div
    class="modal"
    id="modal"
>

    <div
        class="sheet"
        id="sheet"
    >

        <div class="handle"></div>


        <!--
            장식용 X
            실제 클릭 불가능
        -->

        <div
            class="close"
            id="closeButton"
            aria-hidden="true"
        >
            ×
        </div>


        <div class="sheet-content">


            <!-- =================
                 결제 화면
            ================= -->

            <div
                class="page visible"
                id="paymentPage"
            >

                <div class="store">
                    Timer
                </div>


                <div class="product">

                    <div class="product-name">
                        3초 타이머 프리미엄
                    </div>

                    <div class="sub">
                        프리미엄 이용권 · 일회성
                    </div>

                </div>


                <div class="price">

                    ₩100,000

                    <span class="billing">
                        일회성 청구
                    </span>

                </div>


                <div class="info">

                    <div class="label">
                        구매 계정
                    </div>

                    <div class="value">
                        chunhe0208@icloud.com
                    </div>

                </div>


                <div class="info">

                    <div class="label">
                        결제 수단
                    </div>

                    <div class="value">
                        등록된 결제 수단
                    </div>

                </div>


                <div class="benefits">

                    <div class="benefit">
                        ✓ 타이머 시간 자유 설정
                    </div>

                    <div class="benefit">
                        ✓ 광고 없음
                    </div>

                </div>


                <button
                    class="buy"
                    onclick="showPassword()"
                >
                    ₩100,000 구매
                </button>

            </div>



            <!-- =================
                 비밀번호
            ================= -->

            <div
                class="page entering"
                id="passwordPage"
                style="display:none"
            >

                <div class="password-page">

                    <div class="lock">
                        🔒
                    </div>

                    <h2>
                        구매 인증
                    </h2>

                    <p>
                        계속하려면 암호를 입력하세요.
                    </p>

                    <input
                        class="password"
                        id="password"
                        type="password"
                        placeholder="암호"
                    >

                    <button
                        class="confirm"
                        onclick="confirmPassword()"
                    >
                        계속
                    </button>

                </div>

            </div>



            <!-- =================
                 로딩
            ================= -->

            <div
                class="page entering"
                id="loadingPage"
                style="display:none"
            >

                <div class="loading-page">

                    <div class="spinner"></div>

                    <h2>
                        처리 중
                    </h2>

                    <p>
                        잠시만 기다려 주세요.
                    </p>

                </div>

            </div>



            <!-- =================
                 완료
            ================= -->

            <div
                class="page entering"
                id="successPage"
                style="display:none"
            >

                <div class="success-page">

                    <div class="check">
                        ✓
                    </div>

                    <h2>
                        구매 완료
                    </h2>

                    <p>
                        프리미엄 이용권이 활성화되었습니다.<br>
                        타이머 시간을 자유롭게 설정할 수 있습니다.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>



<script>


/* =========================
   타이머 변수
========================= */

let running = false;

let animationFrame = null;

let remaining = 3;

let defaultSeconds = 3;

let endTime = 0;

let premium = false;


/* =========================
   표시
========================= */

function updateDisplay(){

    const minutes =
        Math.floor(
            remaining / 60
        );

    const seconds =
        remaining % 60;


    document
        .getElementById("time")
        .textContent =
        String(minutes).padStart(2,"0")
        + ":" +
        String(seconds).padStart(2,"0");
}


/* =========================
   타이머 실행
========================= */

function tick(){

    if(!running){
        return;
    }


    remaining =
        Math.max(
            0,
            Math.ceil(
                (
                    endTime -
                    performance.now()
                ) / 1000
            )
        );


    updateDisplay();


    if(remaining <= 0){

        running = false;

        animationFrame = null;


        if(!premium){

            setTimeout(
                openPayment,
                180
            );

            return;
        }


        remaining =
            defaultSeconds;

        updateDisplay();

        return;
    }


    animationFrame =
        requestAnimationFrame(
            tick
        );
}


/* =========================
   시작
========================= */

function startTimer(){

    if(running){
        return;
    }


    if(remaining <= 0){

        remaining =
            defaultSeconds;
    }


    running = true;


    endTime =
        performance.now()
        +
        remaining * 1000;


    tick();
}


/* =========================
   일시정지
========================= */

function pauseTimer(){

    if(!running){
        return;
    }


    remaining =
        Math.max(
            0,
            Math.ceil(
                (
                    endTime -
                    performance.now()
                ) / 1000
            )
        );


    running = false;


    if(animationFrame){

        cancelAnimationFrame(
            animationFrame
        );

        animationFrame = null;
    }


    updateDisplay();
}


/* =========================
   초기화
========================= */

function resetTimer(){

    pauseTimer();

    remaining =
        defaultSeconds;

    updateDisplay();
}


/* =========================
   시간 설정
========================= */

function setTime(){

    if(!premium){
        return;
    }


    let value =
        Number(
            document
                .getElementById(
                    "timeInput"
                )
                .value
        );


    if(!value || value < 1){
        return;
    }


    value =
        Math.min(
            value,
            9999
        );


    defaultSeconds =
        value;


    resetTimer();
}


/* =========================
   결제창 열기
========================= */

function openPayment(){

    const modal =
        document.getElementById(
            "modal"
        );


    const payment =
        document.getElementById(
            "paymentPage"
        );


    resizeSheet(payment);


    modal.style.visibility =
        "visible";


    requestAnimationFrame(
        () => {

            modal.classList.add(
                "open"
            );

        }
    );
}


/* =========================
   창 높이 계산
========================= */

function resizeSheet(page){

    const sheet =
        document.getElementById(
            "sheet"
        );


    const oldDisplay =
        page.style.display;

    const oldPosition =
        page.style.position;

    const oldVisibility =
        page.style.visibility;


    page.style.display =
        "block";

    page.style.position =
        "absolute";

    page.style.visibility =
        "hidden";


    const height =
        page.offsetHeight;


    page.style.position =
        oldPosition;

    page.style.visibility =
        oldVisibility;


    if(oldDisplay){

        page.style.display =
            oldDisplay;
    }


    sheet.style.height =
        (height + 70) + "px";
}


/* =========================
   페이지 변경
========================= */

function changePage(from,to){

    to.style.display =
        "block";


    to.classList.remove(
        "visible",
        "leaving"
    );


    to.classList.add(
        "entering"
    );


    resizeSheet(to);


    from.classList.remove(
        "visible"
    );


    from.classList.add(
        "leaving"
    );


    setTimeout(
        () => {

            from.style.display =
                "none";


            from.classList.remove(
                "leaving"
            );


            requestAnimationFrame(
                () => {

                    to.classList.remove(
                        "entering"
                    );

                    to.classList.add(
                        "visible"
                    );

                }
            );

        },
        280
    );
}


/* =========================
   구매 버튼
========================= */

function showPassword(){

    const payment =
        document.getElementById(
            "paymentPage"
        );


    const password =
        document.getElementById(
            "passwordPage"
        );


    changePage(
        payment,
        password
    );


    setTimeout(
        () => {

            document
                .getElementById(
                    "password"
                )
                .focus();

        },
        450
    );
}


/* =========================
   인증
========================= */

function confirmPassword(){

    const password =
        document
            .getElementById(
                "password"
            )
            .value;


    if(password.length === 0){
        return;
    }


    const passwordPage =
        document.getElementById(
            "passwordPage"
        );


    const loadingPage =
        document.getElementById(
            "loadingPage"
        );


    changePage(
        passwordPage,
        loadingPage
    );


    setTimeout(
        () => {

            const loading =
                document.getElementById(
                    "loadingPage"
                );


            const success =
                document.getElementById(
                    "successPage"
                );


            changePage(
                loading,
                success
            );


            premium = true;


            document
                .getElementById(
                    "settings"
                )
                .classList.add(
                    "show"
                );


            setTimeout(
                closePayment,
                3000
            );

        },
        2000
    );
}


/* =========================
   닫기
========================= */

function closePayment(){

    const modal =
        document.getElementById(
            "modal"
        );


    modal.classList.remove(
        "open"
    );


    modal.classList.add(
        "closing"
    );


    setTimeout(
        () => {

            modal.classList.remove(
                "closing"
            );


            modal.style.visibility =
                "hidden";


            resetPages();

        },
        520
    );
}


/* =========================
   페이지 초기화
========================= */

function resetPages(){

    const pages = [

        document.getElementById(
            "paymentPage"
        ),

        document.getElementById(
            "passwordPage"
        ),

        document.getElementById(
            "loadingPage"
        ),

        document.getElementById(
            "successPage"
        )

    ];


    pages.forEach(
        page => {

            page.style.display =
                "none";

            page.classList.remove(
                "visible",
                "leaving",
                "entering"
            );

        }
    );


    const payment =
        document.getElementById(
            "paymentPage"
        );


    payment.style.display =
        "block";


    payment.classList.add(
        "visible"
    );


    document.getElementById(
        "password"
    ).value = "";


    /*
       X 위치 초기화
    */

    const close =
        document.getElementById(
            "closeButton"
        );


    close.style.position =
        "absolute";

    close.style.left =
        "";

    close.style.top =
        "";

    close.style.right =
        "18px";


    setTimeout(
        () => {

            resizeSheet(payment);

        },
        20
    );
}


/* ==================================================
   X 버튼 도망 시스템
================================================== */

const closeButton =
    document.getElementById(
        "closeButton"
    );


const sheet =
    document.getElementById(
        "sheet"
    );


const modal =
    document.getElementById(
        "modal"
    );


let lastEscape =
    0;


document.addEventListener(
    "mousemove",
    (event) => {

        /*
           결제창이 열려있지 않으면
           아무것도 하지 않음
        */

        if(
            !modal.classList.contains(
                "open"
            )
        ){
            return;
        }


        const rect =
            closeButton.getBoundingClientRect();


        const centerX =
            rect.left +
            rect.width / 2;


        const centerY =
            rect.top +
            rect.height / 2;


        const dx =
            centerX -
            event.clientX;


        const dy =
            centerY -
            event.clientY;


        const distance =
            Math.hypot(
                dx,
                dy
            );


        /*
           마우스가 130px 이내로 오면
           즉시 회피
        */

        if(distance > 130){
            return;
        }


        const now =
            performance.now();


        /*
           매우 빠르게 반응
        */

        if(
            now -
            lastEscape <
            25
        ){
            return;
        }


        lastEscape =
            now;


        const length =
            Math.hypot(
                dx,
                dy
            ) || 1;


        /*
           마우스 반대쪽으로
           빠르게 크게 이동
        */

        const move =
            70;


        let x =
            closeButton.offsetLeft
            +
            (
                dx / length
            )
            *
            move;


        let y =
            closeButton.offsetTop
            +
            (
                dy / length
            )
            *
            move;


        /*
           모서리 방지
        */

        const padding =
            18;


        const minX =
            padding;


        const minY =
            padding;


        const maxX =
            Math.max(
                minX,
                sheet.clientWidth -
                closeButton.offsetWidth -
                padding
            );


        const maxY =
            Math.max(
                minY,
                sheet.clientHeight -
                closeButton.offsetHeight -
                padding
            );


        x =
            Math.max(
                minX,
                Math.min(
                    x,
                    maxX
                )
            );


        y =
            Math.max(
                minY,
                Math.min(
                    y,
                    maxY
                )
            );


        closeButton.style.position =
            "absolute";


        closeButton.style.right =
            "auto";


        closeButton.style.left =
            x + "px";


        closeButton.style.top =
            y + "px";

    }
);


/* =========================
   비밀번호 Enter
========================= */

document
    .getElementById(
        "password"
    )
    .addEventListener(
        "keydown",
        event => {

            if(
                event.key ===
                "Enter"
            ){

                confirmPassword();

            }

        }
    );


/* =========================
   초기 실행
========================= */

updateDisplay();

</script>
