<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Pretendard",
        "Segoe UI",
        sans-serif;

    background: #000;
    color: #fff;

    display: flex;
    justify-content: center;
    align-items: center;
}


/* =========================
   메인 타이머
========================= */

.main {
    width: min(92vw, 520px);
    text-align: center;
}

.title {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -1px;

    margin-bottom: 35px;
}

.time {
    font-size: clamp(72px, 17vw, 105px);
    font-weight: 700;

    letter-spacing: -6px;

    font-variant-numeric: tabular-nums;

    margin-bottom: 30px;
}


/* 버튼 */

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: 0;
    cursor: pointer;

    font-family: inherit;
}

.start {
    padding: 16px 27px;

    border-radius: 17px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;

    transition: .2s;
}

.start:hover {
    transform: scale(1.04);
}

.start:active {
    transform: scale(.96);
}

.secondary {
    padding: 16px 22px;

    border-radius: 17px;

    background: #1c1c1e;
    color: #fff;

    border: 1px solid #333;

    font-size: 15px;
}

.secondary:hover {
    background: #29292b;
}


/* =========================
   시간 설정
========================= */

.settings {
    margin-top: 25px;

    padding: 17px;

    border-radius: 20px;

    background: #111;

    border: 1px solid #242424;
}

.settings-title {
    color: #aaa;

    font-size: 12px;

    margin-bottom: 11px;
}

.time-input {
    width: 120px;
    height: 45px;

    padding: 0 12px;

    border-radius: 12px;

    border: 1px solid #3a3a3a;

    background: #1c1c1e;
    color: #fff;

    outline: none;

    text-align: center;

    font-size: 17px;
}

.set-button {
    height: 45px;

    margin-left: 6px;

    padding: 0 17px;

    border-radius: 12px;

    background: #fff;
    color: #000;

    font-weight: 600;
}


/* =========================
   결제 배경
========================= */

.modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: flex-end;
    justify-content: center;

    padding: 12px;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    z-index: 100;
}


/* =========================
   결제 시트
========================= */

.sheet {
    width: min(100%, 450px);

    padding: 24px;

    background: #1c1c1e;

    border-radius: 30px;

    border: 1px solid #38383a;

    box-shadow:
        0 -20px 80px rgba(0,0,0,.5);

    animation:
        slideUp .4s cubic-bezier(.2,.8,.2,1);
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(100%);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.handle {
    width: 38px;
    height: 5px;

    margin: 0 auto 24px;

    border-radius: 10px;

    background: #555;
}


/* 상단 */

.store {
    text-align: center;

    font-size: 17px;
    font-weight: 600;

    margin-bottom: 24px;
}


/* 상품 */

.product {
    text-align: center;

    padding-bottom: 22px;

    border-bottom: 1px solid #38383a;
}

.product-name {
    font-size: 24px;
    font-weight: 700;

    letter-spacing: -.7px;
}

.product-sub {
    margin-top: 7px;

    color: #98989d;

    font-size: 13px;
}


/* 가격 */

.price {
    text-align: center;

    padding: 22px 0;

    font-size: 40px;
    font-weight: 700;

    letter-spacing: -1.5px;
}

.billing {
    display: block;

    margin-top: 5px;

    color: #98989d;

    font-size: 12px;

    font-weight: 400;
}


/* 정보 */

.info {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 15px 0;

    border-bottom: 1px solid #38383a;
}

.info-label {
    color: #98989d;

    font-size: 13px;
}

.info-value {
    font-size: 12px;
}


/* 혜택 */

.benefits {
    padding: 16px 0;

    border-bottom: 1px solid #38383a;
}

.benefit {
    margin: 8px 0;

    font-size: 13px;
}


/* 구매 */

.buy {
    width: 100%;
    height: 54px;

    margin-top: 20px;

    border-radius: 15px;

    background: #fff;
    color: #000;

    font-size: 16px;
    font-weight: 600;
}


/* =========================
   암호
========================= */

.password-screen {
    display: none;

    text-align: center;

    padding: 20px 5px;
}

.password-icon {
    font-size: 38px;

    margin-bottom: 18px;
}

.password-screen h2 {
    margin: 0;

    font-size: 23px;
}

.password-screen p {
    color: #98989d;

    font-size: 13px;

    margin: 9px 0 20px;
}

.password-input {
    width: 100%;
    height: 50px;

    border-radius: 13px;

    border: 1px solid #444;

    background: #2c2c2e;

    color: #fff;

    outline: none;

    padding: 0 15px;

    text-align: center;

    font-size: 16px;
}

.confirm {
    width: 100%;
    height: 52px;

    margin-top: 12px;

    border-radius: 14px;

    background: #fff;
    color: #000;

    font-weight: 600;
}


/* =========================
   결제 중
========================= */

.loading {
    display: none;

    text-align: center;

    padding: 40px 5px;
}

.spinner {
    width: 36px;
    height: 36px;

    margin: 0 auto 20px;

    border-radius: 50%;

    border: 3px solid #444;
    border-top-color: #fff;

    animation: spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.loading h2 {
    margin: 0 0 8px;

    font-size: 21px;
}

.loading p {
    margin: 0;

    color: #98989d;

    font-size: 13px;
}


/* =========================
   완료
========================= */

.success {
    display: none;

    text-align: center;

    padding: 30px 5px;
}

.success-icon {
    width: 68px;
    height: 68px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #fff;
    color: #000;

    font-size: 34px;
}

.success h2 {
    margin: 0 0 9px;

    font-size: 23px;
}

.success p {
    margin: 0;

    color: #98989d;

    font-size: 13px;

    line-height: 1.6;
}


/* 모바일 */

@media(max-width:500px) {

    .sheet {
        border-radius: 28px;
        padding: 22px;
    }

    .price {
        font-size: 37px;
    }
}
</style>
</head>


<body>


<!-- =========================
     TIMER
========================= -->

<div class="main">

    <div class="title">
        Timer
    </div>


    <div
        class="time"
        id="time"
    >
        00:03
    </div>


    <div class="buttons">

        <button
            class="start"
            onclick="startTimer()"
        >
            시작
        </button>

        <button
            class="secondary"
            onclick="pauseTimer()"
        >
            일시정지
        </button>

        <button
            class="secondary"
            onclick="resetTimer()"
        >
            초기화
        </button>

    </div>


    <!-- 시간 설정 -->

    <div class="settings">

        <div class="settings-title">
            타이머 시간 설정
        </div>

        <input
            id="timeInput"
            class="time-input"
            type="number"
            min="1"
            max="9999"
            value="3"
        >

        <button
            class="set-button"
            onclick="setTimer()"
        >
            설정
        </button>

    </div>

</div>



<!-- =========================
     PAYMENT
========================= -->

<div
    class="modal"
    id="modal"
>

    <div class="sheet">

        <div class="handle"></div>


        <!-- 결제 정보 -->

        <div id="paymentInfo">

            <div class="store">
                App Store
            </div>


            <div class="product">

                <div class="product-name">
                    3초 타이머 프리미엄
                </div>

                <div class="product-sub">
                    앱 내 구입 · 일회성
                </div>

            </div>


            <div class="price">

                ₩100,000

                <span class="billing">
                    일회성 청구
                </span>

            </div>


            <div class="info">

                <div class="info-label">
                    구매 계정
                </div>

                <div class="info-value">
                    chunhe0208@icloud.com
                </div>

            </div>


            <div class="info">

                <div class="info-label">
                    결제 수단
                </div>

                <div class="info-value">
                    등록된 결제 수단
                </div>

            </div>


            <div class="benefits">

                <div class="benefit">
                    ✓ 3초 타이머 무제한 사용
                </div>

                <div class="benefit">
                    ✓ 광고 없음
                </div>

            </div>


            <button
                class="buy"
                onclick="showPassword()"
            >
                ₩100,000 구매
            </button>

        </div>



        <!-- =========================
             PASSWORD
        ========================= -->

        <div
            class="password-screen"
            id="passwordScreen"
        >

            <div class="password-icon">
                🔒
            </div>

            <h2>
                구매 인증
            </h2>

            <p>
                계속하려면 암호를 입력하세요.
            </p>

            <input
                id="password"
                class="password-input"
                type="password"
                autocomplete="off"
                placeholder="암호"
            >

            <button
                class="confirm"
                onclick="confirmPassword()"
            >
                계속
            </button>

        </div>



        <!-- =========================
             LOADING
        ========================= -->

        <div
            class="loading"
            id="loading"
        >

            <div class="spinner"></div>

            <h2>
                결제 처리 중
            </h2>

            <p>
                잠시만 기다려 주세요.
            </p>

        </div>



        <!-- =========================
             SUCCESS
        ========================= -->

        <div
            class="success"
            id="success"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                구매 완료
            </h2>

            <p>
                프리미엄 이용권이 활성화되었습니다.<br>
                이제 타이머를 무제한으로 사용할 수 있습니다.
            </p>

        </div>

    </div>

</div>



<script>

let timer = null;

let remaining = 3;

let defaultSeconds = 3;

let running = false;

let premium = false;


/* =========================
   화면 표시
========================= */

function updateDisplay() {

    let minutes =
        Math.floor(remaining / 60);

    let seconds =
        remaining % 60;

    let mm =
        String(minutes).padStart(2, "0");

    let ss =
        String(seconds).padStart(2, "0");

    document.getElementById("time").textContent =
        mm + ":" + ss;
}


/* =========================
   시작
========================= */

function startTimer() {

    if (running) return;

    running = true;


    timer = setInterval(() => {

        if (remaining > 0) {

            remaining--;

            updateDisplay();

        }


        if (remaining <= 0) {

            clearInterval(timer);

            timer = null;

            running = false;


            if (premium) {

                remaining = defaultSeconds;

                updateDisplay();

            } else {

                openPayment();

            }

        }

    }, 1000);
}


/* =========================
   일시정지
========================= */

function pauseTimer() {

    if (!running) return;

    clearInterval(timer);

    timer = null;

    running = false;
}


/* =========================
   초기화
========================= */

function resetTimer() {

    if (timer !== null) {

        clearInterval(timer);

        timer = null;
    }

    running = false;

    remaining = defaultSeconds;

    updateDisplay();
}


/* =========================
   시간 설정
========================= */

function setTimer() {

    let value =
        Number(
            document.getElementById("timeInput").value
        );


    if (!value || value < 1) {

        return;
    }


    if (value > 9999) {

        value = 9999;
    }


    defaultSeconds = value;

    remaining = value;

    resetTimer();
}


/* =========================
   결제창
========================= */

function openPayment() {

    document.getElementById("modal").style.display =
        "flex";
}


/* =========================
   구매 버튼
========================= */

function showPassword() {

    document.getElementById("paymentInfo").style.display =
        "none";

    document.getElementById("passwordScreen").style.display =
        "block";


    setTimeout(() => {

        document.getElementById("password").focus();

    }, 100);
}


/* =========================
   암호
========================= */

function confirmPassword() {

    const password =
        document.getElementById("password").value;


    /*
      모의 인증.
      아무 문자열이나 입력하면 통과.
      입력값은 저장하거나 전송하지 않음.
    */

    if (password.length === 0) {

        return;
    }


    document.getElementById("passwordScreen").style.display =
        "none";

    document.getElementById("loading").style.display =
        "block";


    setTimeout(() => {

        document.getElementById("loading").style.display =
            "none";

        document.getElementById("success").style.display =
            "block";


        premium = true;


        /*
          완료 화면 3초 표시
        */

        setTimeout(() => {

            document.getElementById("modal").style.display =
                "none";

            document.getElementById("success").style.display =
                "none";

            document.getElementById("paymentInfo").style.display =
                "block";

            document.getElementById("passwordScreen").style.display =
                "none";

            document.getElementById("password").value =
                "";

        }, 3000);

    }, 2200);
}


/* =========================
   처음 표시
========================= */

updateDisplay();

</script>

</body>
</html>
