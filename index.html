<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timer</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Pretendard", "Segoe UI", sans-serif;

    background:
        radial-gradient(circle at 50% -10%, #ffffff 0%, #eeeeee 45%, #d7d7d7 100%);

    color: #111;
}

/* 메인 유리창 */
.card {
    width: min(92vw, 520px);
    padding: 45px 40px;
    text-align: center;

    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 34px;

    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);

    box-shadow:
        0 30px 80px rgba(0,0,0,0.15),
        inset 0 1px 1px rgba(255,255,255,0.9);

    animation: appear .6s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.96);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

h1 {
    margin: 0 0 30px;
    font-size: 29px;
    letter-spacing: -1px;
}

#time {
    font-size: clamp(65px, 16vw, 95px);
    font-weight: 700;
    letter-spacing: -5px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 35px;
}

/* 버튼 */
button {
    border: 0;
    border-radius: 17px;
    padding: 15px 24px;

    background: #111;
    color: white;

    font-size: 16px;
    font-weight: 600;
    cursor: pointer;

    box-shadow: 0 9px 22px rgba(0,0,0,.18);

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

button:hover {
    transform: scale(1.08);
    background: #000;
    box-shadow: 0 15px 32px rgba(0,0,0,.25);
}

button:active {
    transform: scale(.95);
}

/* 3초 버튼 */
.three-button {
    width: 210px;
    height: 62px;
    font-size: 19px;
}

/* 결제창 배경 */
.modal-bg {
    position: fixed;
    inset: 0;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,.42);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    padding: 20px;
}

/* 결제창 */
.payment {
    width: min(92vw, 430px);
    padding: 30px;

    background: rgba(255,255,255,.88);
    border: 1px solid rgba(255,255,255,.9);
    border-radius: 28px;

    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);

    box-shadow: 0 30px 80px rgba(0,0,0,.3);

    animation: paymentAppear .35s ease;
}

@keyframes paymentAppear {
    from {
        opacity: 0;
        transform: scale(.9);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.payment h2 {
    margin: 0 0 8px;
    font-size: 25px;
}

.demo {
    display: inline-block;
    margin-bottom: 22px;

    padding: 6px 10px;
    border-radius: 10px;

    background: #eeeeee;
    color: #666;

    font-size: 12px;
    font-weight: 600;
}

.price {
    font-size: 38px;
    font-weight: 750;
    margin: 15px 0 25px;
}

.benefits {
    padding: 20px;
    border-radius: 18px;
    background: rgba(245,245,245,.8);

    text-align: left;
    margin-bottom: 22px;
}

.benefits-title {
    font-weight: 700;
    margin-bottom: 12px;
}

.benefit {
    margin: 9px 0;
    color: #333;
}

.pay-button {
    width: 100%;
    height: 54px;
    font-size: 17px;
}

.close-button {
    width: 100%;
    margin-top: 10px;

    background: #e9e9e9;
    color: #111;

    box-shadow: none;
}

.close-button:hover {
    background: #ddd;
}

/* 완료 메시지 */
.success {
    display: none;
    text-align: center;
}

.success-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

.success h2 {
    margin-bottom: 8px;
}

.success p {
    color: #666;
}

@media (max-width: 500px) {
    .card {
        padding: 35px 20px;
        border-radius: 28px;
    }
}
</style>
</head>

<body>

<div class="card">

    <h1>Timer</h1>

    <div id="time">00:03</div>

    <button class="three-button" onclick="startThreeSeconds()">
        3초 카운트
    </button>

</div>


<!-- 결제창 -->
<div class="modal-bg" id="paymentModal">

    <div class="payment">

        <div id="paymentContent">

            <span class="demo">모의 결제 · 실제 결제되지 않음</span>

            <h2>프리미엄 이용권</h2>

            <div class="price">₩100,000</div>

            <div class="benefits">

                <div class="benefits-title">
                    결제 시 혜택
                </div>

                <div class="benefit">
                    ✓ 3초 타이머 무제한 사용
                </div>

                <div class="benefit">
                    ✓ 광고 없음
                </div>

                <div class="benefit">
                    ✓ 프리미엄 기능 이용
                </div>

            </div>

            <button class="pay-button" onclick="fakePayment()">
                ₩100,000 결제하기
            </button>

            <button class="close-button" onclick="closePayment()">
                닫기
            </button>

        </div>


        <div class="success" id="success">

            <div class="success-icon">✓</div>

            <h2>결제가 완료되었습니다</h2>

            <p>
                축하합니다!<br>
                이제 3초 타이머를 무제한으로 사용할 수 있습니다.
            </p>

            <button class="pay-button" onclick="closePayment()">
                확인
            </button>

        </div>

    </div>

</div>


<script>

let countdownTimer = null;
let premium = false;


/* 3초 카운트 */
function startThreeSeconds() {

    if (countdownTimer !== null) {
        return;
    }

    let remaining = 3;

    document.getElementById("time").textContent =
        "00:0" + remaining;

    countdownTimer = setInterval(() => {

        remaining--;

        if (remaining > 0) {

            document.getElementById("time").textContent =
                "00:0" + remaining;

        } else {

            clearInterval(countdownTimer);
            countdownTimer = null;

            document.getElementById("time").textContent =
                "00:00";

            setTimeout(() => {
                showPayment();
            }, 300);

        }

    }, 1000);
}


/* 결제창 열기 */
function showPayment() {

    if (premium) {
        startThreeSeconds();
        return;
    }

    document.getElementById("paymentModal").style.display =
        "flex";
}


/* 결제창 닫기 */
function closePayment() {

    document.getElementById("paymentModal").style.display =
        "none";

    document.getElementById("paymentContent").style.display =
        "block";

    document.getElementById("success").style.display =
        "none";
}


/* 모의 결제 */
function fakePayment() {

    /* 실제 결제는 절대 발생하지 않음 */

    premium = true;

    document.getElementById("paymentContent").style.display =
        "none";

    document.getElementById("success").style.display =
        "block";
}

</script>

</body>
</html>
