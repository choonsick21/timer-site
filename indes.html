<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                         "Pretendard", "Segoe UI", sans-serif;

            background:
                radial-gradient(circle at 50% 0%, #ffffff 0%, #e8e8e8 45%, #d5d5d5 100%);

            color: #111;
        }

        /* 유리 카드 */
        .timer-card {
            width: min(90%, 480px);
            padding: 45px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.48);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);

            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 32px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.12),
                inset 0 1px 1px rgba(255, 255, 255, 0.8);

            animation: appear 0.7s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        h1 {
            margin: 0 0 30px;
            font-size: 28px;
            font-weight: 650;
            letter-spacing: -1px;
        }

        /* 시간 */
        #time {
            margin-bottom: 30px;

            font-size: clamp(60px, 15vw, 90px);
            font-weight: 700;
            letter-spacing: -5px;

            font-variant-numeric: tabular-nums;
        }

        /* 입력창 */
        .inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            width: 110px;
            padding: 15px;

            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 16px;

            background: rgba(255, 255, 255, 0.55);

            font-size: 17px;
            text-align: center;
            outline: none;

            transition: 0.25s ease;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.85);
            border-color: rgba(0, 0, 0, 0.25);
            transform: scale(1.03);
        }

        /* 버튼 */
        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 15px;

            padding: 14px 22px;

            background: #111;
            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        /* 마우스 올리면 커짐 */
        button:hover {
            transform: scale(1.08);
            background: #000;

            box-shadow:
                0 12px 28px rgba(0, 0, 0, 0.25);
        }

        button:active {
            transform: scale(0.96);
        }

        /* 모바일 */
        @media (max-width: 500px) {
            .timer-card {
                padding: 35px 20px;
                border-radius: 27px;
            }

            .buttons {
                flex-wrap: wrap;
            }

            button {
                flex: 1;
                min-width: 90px;
            }

            input {
                width: 100px;
            }
        }
    </style>
</head>

<body>

    <div class="timer-card">

        <h1>Timer</h1>

        <div id="time">00:00</div>

        <div class="inputs">
            <input
                type="number"
                id="minutes"
                placeholder="분"
                min="0"
            >

            <input
                type="number"
                id="seconds"
                placeholder="초"
                min="0"
                max="59"
            >
        </div>

        <div class="buttons">
            <button onclick="startTimer()">시작</button>
            <button onclick="pauseTimer()">일시정지</button>
            <button onclick="resetTimer()">초기화</button>
        </div>

    </div>

    <script>
        let totalSeconds = 0;
        let timer = null;

        function updateDisplay() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            document.getElementById("time").textContent =
                String(minutes).padStart(2, "0") + ":" +
                String(seconds).padStart(2, "0");
        }

        function startTimer() {
            if (timer !== null) return;

            if (totalSeconds === 0) {
                const minutes =
                    Number(document.getElementById("minutes").value) || 0;

                const seconds =
                    Number(document.getElementById("seconds").value) || 0;

                totalSeconds = minutes * 60 + seconds;
            }

            if (totalSeconds <= 0) return;

            timer = setInterval(() => {
                totalSeconds--;
                updateDisplay();

                if (totalSeconds <= 0) {
                    clearInterval(timer);
                    timer = null;

                    alert("시간이 끝났습니다.");
                }
            }, 1000);
        }

        function pauseTimer() {
            clearInterval(timer);
            timer = null;
        }

        function resetTimer() {
            clearInterval(timer);
            timer = null;

            totalSeconds = 0;

            updateDisplay();

            document.getElementById("minutes").value = "";
            document.getElementById("seconds").value = "";
        }
    </script>

</body>
</html>
